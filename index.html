<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOOL PRO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff; color: #000; }
    .btn-adidas { background: #000; color: #fff; font-weight: 900; text-transform: uppercase; padding: 1rem 1.2rem; border-radius: 4px; }
    .card { border: 1px solid #eee; transition: 0.3s; }
    .card:hover { border-color: #000; }
    .size-btn { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; font-weight: 700; font-size: 14px; }
    .size-btn.active { border-color: #000; background: #000; color: #fff; }
    .cart-drawer { position: fixed; right: -420px; top: 0; width: 420px; max-width: 100vw; height: 100%; background: #fff; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: 0.3s; z-index: 1000; padding: 20px; display: flex; flex-direction: column; }
    .cart-drawer.open { right: 0; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 900; }
    .overlay.show { display: block; }
  </style>
</head>
<body>
  <div id="overlay" class="overlay" onclick="toggleCart(false)"></div>
  <div id="zoomModal" class="fixed inset-0 z-[2000] hidden items-center justify-center bg-black/80 p-4" onclick="closeZoom()"><img id="zoomImg" src="" alt="zoom" class="max-h-[92vh] max-w-[96vw] object-contain rounded-lg shadow-2xl bg-white"></div>
  <nav class="px-5 py-4 md:px-8 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-50"><div class="text-2xl md:text-3xl font-black uppercase tracking-tighter">KOOL PRO</div><div class="text-[10px] uppercase tracking-[.22em] text-gray-500 font-bold">Código: stock/zoom/checkout</div><button onclick="toggleCart(true)" class="relative"><i class="fa-solid fa-cart-shopping text-xl"></i><span id="cartCount" class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span></button></nav>
  <main class="max-w-7xl mx-auto px-5 md:px-8 py-12"><div class="mb-4 text-xs uppercase tracking-[.2em] text-gray-500 font-bold">El sistema controla stock, zoom y carrito automáticamente</div><div id="catalog" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div></main>
  <div id="cartDrawer" class="cart-drawer"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-black uppercase">Tu Carrito</h2><button onclick="toggleCart(false)"><i class="fa-solid fa-xmark text-2xl"></i></button></div><div id="cartItems" class="flex-1 overflow-y-auto space-y-4 pr-1"></div><div class="border-t border-gray-100 pt-5 mt-5 space-y-4"><div class="flex justify-between text-xl font-black"><span>Total</span><span id="cartTotal">$0</span></div><div class="space-y-2"><input id="cName" class="w-full border p-3" placeholder="Nombre completo"><input id="cPhone" class="w-full border p-3" placeholder="WhatsApp"><textarea id="cAddr" class="w-full border p-3 h-20" placeholder="Dirección de envío"></textarea></div><button onclick="checkout()" id="btnPay" class="btn-adidas w-full">Finalizar Compra</button></div></div>
  <script>
    let inventory = { p1: 6, p2: 4, p3: 5 };
    const products = [
      { id: 'p1', name: 'Runner Blue Mesh', price: 155000, color: 'Azul Oscuro', material: 'Malla transpirable', img: 'data:image/jpeg;base64,/9j/4QE9RXhpZgAATU0AKgAAAAgABgEAAAQAAAABAAAEAAEBAAQAAAABAAAC7AExAAIAAAAeAAAAVodpAAQAAAABAAAAiAESAAMAAAABAAAAAAEyAAIAAAAUAAAAdAAAAABBbmRyb2lkIFJlZE1hZ2ljT1MxMS4wLjVNUl9HQgAyMDI2OjA2OjA5IDA3OjUzOjQ4AAAEkAMAAgAAAAcAAADSkggAAwAAAAEAAAAAAAAAADI', sizes: [35,36,37,38,39,40] },
      { id: 'p2', name: 'Urban Black Gum', price: 145000, color: 'Negro / Goma', material: 'Sintético reforzado', img: 'data:image/jpeg;base64,/9j/4QE9RXhpZgAATU0AKgAAAAgABgEAAAQAAAABAAAEAAEBAAQAAAABAAAC7AExAAIAAAAeAAAAVodpAAQAAAABAAAAiAESAAMAAAABAAAAAAEyAAIAAAAUAAAAdAAAAABBbmRyb2lkIFJlZE1hZ2ljT1MxMS4wLjVNUl9HQgAyMDI2OjA2OjA5IDA3OjUzOjQ4AAAEkAMAAgAAAAcAAADSkggAAwAAAAEAAAAAAAAAADI', sizes: [35,36,37,38,39,40] },
      { id: 'p3', name: 'Nude Texture Heel', price: 135000, color: 'Beige', material: 'Acabado texturizado', img: 'data:image/jpeg;base64,/9j/4QE9RXhpZgAATU0AKgAAAAgABgEAAAQAAAABAAAEAAEBAAQAAAABAAAC7AExAAIAAAAeAAAAVodpAAQAAAABAAAAiAESAAMAAAABAAAAAAEyAAIAAAAUAAAAdAAAAABBbmRyb2lkIFJlZE1hZ2ljT1MxMS4wLjVNUl9HQgAyMDI2OjA2OjA5IDA3OjUzOjQ4AAAEkAMAAgAAAAcAAADSkggAAwAAAAEAAAAAAAAAADI', sizes: [35,36,37,38,39,40] }
    ];
    let cart = [];
    let selectedSizes = {};
    function renderCatalog() { document.getElementById('catalog').innerHTML = products.map(p => `<div class="card p-4 bg-white"><img src="${p.img}" onclick="zoomImage('${p.img}')" onerror="this.onerror=null;this.style.display='none';" class="w-full aspect-square object-cover mb-4 bg-gray-100 cursor-zoom-in" loading="eager"><h3 class="text-xl font-black uppercase">${p.name}</h3><p class="text-gray-500 text-sm mb-2">${p.color} · ${p.material}</p><p class="text-xs font-bold uppercase tracking-[.18em] text-emerald-700 mb-4">Stock disponible: ${inventory[p.id]} pares</p><div class="text-2xl font-black mb-6">$${p.price.toLocaleString('es-CO')}</div><div class="grid grid-cols-6 gap-1 mb-6">${p.sizes.map(s => `<div onclick="selectSize('${p.id}', ${s})" class="size-btn ${selectedSizes[p.id] === s ? 'active' : ''}">${s}</div>`).join('')}</div><button onclick="addToCart('${p.id}')" class="btn-adidas w-full ${inventory[p.id] <= 0 ? 'opacity-40 cursor-not-allowed' : ''}" ${inventory[p.id] <= 0 ? 'disabled' : ''}>${inventory[p.id] <= 0 ? 'Agotado' : 'Agregar (' + inventory[p.id] + ')'}</button></div>`).join(''); }
    function selectSize(pid, s) { selectedSizes[pid] = s; renderCatalog(); }
    function zoomImage(src) { const m=document.getElementById('zoomModal'); const i=document.getElementById('zoomImg'); i.src=src; m.classList.remove('hidden'); m.classList.add('flex'); }
    function closeZoom(){ const m=document.getElementById('zoomModal'); m.classList.add('hidden'); m.classList.remove('flex'); }
    function addToCart(pid) { if (!selectedSizes[pid]) return alert('Selecciona talla'); if (!inventory[pid] || inventory[pid] <= 0) return alert('No hay stock suficiente'); const p = products.find(x => x.id === pid); cart.push({ ...p, size: selectedSizes[pid] }); inventory[pid] -= 1; updateCart(); renderCatalog(); toggleCart(true); }
    function updateCart() { document.getElementById('cartCount').innerText = cart.length; document.getElementById('cartTotal').innerText = '$' + cart.reduce((s, i) => s + i.price, 0).toLocaleString('es-CO'); document.getElementById('cartItems').innerHTML = cart.length ? cart.map((i, idx) => `<div class="flex gap-4 border-b pb-4"><img src="${i.img}" class="w-16 h-16 object-cover"><div class="flex-1"><div class="font-black uppercase text-[10px]">${i.name} (T:${i.size})</div><div class="text-[10px] text-emerald-700 font-bold">Stock restante: ${inventory[i.id] || 0}</div><div class="font-black">$${i.price.toLocaleString('es-CO')}</div></div><button onclick="removeItem(${idx})"><i class="fa-solid fa-trash text-gray-300"></i></button></div>`).join('') : '<div class="text-gray-400 py-8 text-center">Tu carrito está vacío</div>'; }
    function removeItem(idx) { const item = cart[idx]; if (item) inventory[item.id] = (inventory[item.id] || 0) + 1; cart.splice(idx, 1); updateCart(); renderCatalog(); }
    function toggleCart(s) { const d=document.getElementById('cartDrawer'); const o=document.getElementById('overlay'); if (s === true) { d.classList.add('open'); o.classList.add('show'); } else { d.classList.remove('open'); o.classList.remove('show'); } }
    async function checkout() { const name=document.getElementById('cName').value; const phone=document.getElementById('cPhone').value; const addr=document.getElementById('cAddr').value; if (!name || !phone || !addr || !cart.length) return alert('Datos incompletos'); const btn=document.getElementById('btnPay'); btn.disabled=true; btn.innerText='PROCESANDO...'; const total=cart.reduce((s,i)=>s+i.price,0); const desc=cart.map(i=>`${i.name} (T:${i.size})`).join(', '); try { const res = await fetch('https://bold-bridge-7qge.vercel.app/api/checkout', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ amount: total, label:'KOOL PRO', description: desc + ' | ' + addr }) }); const data = await res.json(); if (data.url) { window.open('https://wa.me/573057778133?text=' + encodeURIComponent('Pedido: ' + desc + ' - Total: $' + total.toLocaleString()), '_blank'); location.href = data.url; } } catch(e) { alert('Error'); btn.disabled=false; btn.innerText='Finalizar Compra'; } }
    renderCatalog();
    updateCart();
  </script>
</body>
</html>

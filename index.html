<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calzado Kool | Catálogo Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc}
    .card{transition:.25s ease;}
    .card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.08)}
    .grad{background:linear-gradient(135deg,#f97316 0%,#ea580c 100%)}
    .size-btn.active{background:#ea580c;color:#fff;border-color:#ea580c}
  </style>
</head>
<body class="text-slate-800">
  <header class="grad text-white sticky top-0 z-50 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-extrabold">Calzado Kool</h1>
        <p class="text-sm opacity-90">Catálogo oficial</p>
      </div>
      <button id="openCartBtn" onclick="openCart()" class="bg-white/15 hover:bg-white/25 px-4 py-2 rounded-full text-sm font-semibold">Carrito</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <section class="mb-8">
      <h2 class="text-3xl font-bold mb-2">Productos destacados</h2>
      <p class="text-slate-600">Selecciona talla, agrega al carrito y finaliza la compra.</p>
    </section>
    <section id="products" class="grid gap-6 md:grid-cols-2 xl:grid-cols-3"></section>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[60]">
    <div class="bg-white w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="p-4 border-b flex items-center justify-between">
        <h3 id="modalTitle" class="text-2xl font-bold"></h3>
        <button onclick="closeModal()" class="text-2xl leading-none">&times;</button>
      </div>
      <div class="p-6 grid md:grid-cols-2 gap-6">
        <div>
          <img id="modalImage" src="img/bota_roja.jpg" alt="Producto" class="w-full rounded-2xl object-cover aspect-square bg-slate-100 cursor-zoom-in" onclick="window.open(this.src,'_blank')">
        </div>
        <div>
          <p id="modalPrice" class="text-3xl font-extrabold text-orange-600"></p>
          <p id="modalDesc" class="text-slate-600 mt-2"></p>
          <div class="mt-5">
            <h4 class="font-bold mb-2">Tallas disponibles</h4>
            <div id="sizeButtons" class="flex flex-wrap gap-2"></div>
          </div>
          <div class="mt-6">
            <button id="addToCartBtn" onclick="addToCartFromModal()" class="w-full grad text-white py-3 rounded-2xl font-bold">Agregar al carrito</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="cartPanel" class="fixed right-4 bottom-4 w-full max-w-md bg-white rounded-3xl shadow-2xl hidden z-[60] border border-slate-200">
    <div class="p-4 border-b flex items-center justify-between">
      <h3 class="font-bold text-lg">Carrito</h3>
      <button onclick="closeCart()" class="text-2xl leading-none">&times;</button>
    </div>
    <div class="p-4 space-y-3 text-sm">
      <div id="cartItems" class="space-y-2 max-h-72 overflow-auto"></div>
      <div class="flex items-center justify-between pt-3 border-t">
        <span class="font-semibold">Total</span>
        <span id="cartTotal" class="font-black text-orange-600">$0</span>
      </div>
      <button id="btn-checkout" onclick="checkout()" class="w-full grad text-white py-3 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg">
        <i class="fa-solid fa-credit-card"></i> FINALIZAR COMPRA Y PAGAR
      </button>
      <p id="connectionStatus" class="text-xs text-slate-500"></p>
    </div>
  </div>

  <script>
    const products = [{
      name:'Bota Urbana Roja', price:2000, color:'Rojo',
      sizes:{'34':1,'35':2,'36':2,'37':2,'38':3,'39':1},
      skuMap:{'34':'020','35':'021','36':'022','37':'023','38':'024','39':'025'},
      description:'Bota urbana de referencia con inventario sincronizado.'
    }];

    let cart = [];
    let currentProduct = null;
    let currentSize = null;

    const fmt = v => '$' + v.toLocaleString('es-CO');
    const productsEl = document.getElementById('products');
    const cartItems = document.getElementById('cartItems');
    const cartTotal = document.getElementById('cartTotal');
    const connectionStatus = document.getElementById('connectionStatus');

    function renderProducts(){
      productsEl.innerHTML = products.map((p, idx) => `
        <article class="card bg-white rounded-3xl overflow-hidden shadow-lg border border-slate-100">
          <div class="aspect-square bg-slate-100 overflow-hidden">
            <img src="img/bota_roja.jpg" class="w-full h-full object-cover cursor-zoom-in" onclick="openProduct(${idx})" alt="${p.name}">
          </div>
          <div class="p-5">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h3 class="text-xl font-extrabold">${p.name}</h3>
                <p class="text-slate-500 text-sm mt-1">${p.description}</p>
              </div>
              <div class="text-right">
                <div class="text-xs uppercase text-slate-400">Precio</div>
                <div class="text-orange-600 text-2xl font-black">${fmt(p.price)}</div>
              </div>
            </div>
            <div class="mt-4 flex flex-wrap gap-2">
              ${Object.entries(p.sizes).map(([s,q]) => `<button class="size-btn border rounded-full px-3 py-1 text-sm" onclick="openProduct(${idx}, '${s}')">${s} (${q})</button>`).join('')}
            </div>
          </div>
        </article>
      `).join('');
    }

    function openProduct(index, size=null){
      currentProduct = products[index];
      currentSize = size || Object.keys(currentProduct.sizes).find(s => currentProduct.sizes[s] > 0);
      document.getElementById('modalTitle').textContent = currentProduct.name;
      document.getElementById('modalPrice').textContent = fmt(currentProduct.price);
      document.getElementById('modalDesc').textContent = currentProduct.description;
      document.getElementById('sizeButtons').innerHTML = Object.entries(currentProduct.sizes).map(([s,q]) => `<button class="size-btn border rounded-full px-4 py-2 ${currentSize===s?'active':''}" onclick="selectSize('${s}')">${s} <span class="text-xs opacity-75">(${q})</span></button>`).join('');
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }
    function selectSize(size){ currentSize = size; openProduct(products.indexOf(currentProduct), size); }
    function closeModal(){ document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); }
    function addToCartFromModal(){
      if (!currentProduct || !currentSize) return alert('Selecciona una talla');
      cart.push({ name:currentProduct.name, price:currentProduct.price, size:currentSize, color:currentProduct.color, sku:currentProduct.skuMap[currentSize], qty:1 });
      closeModal();
      openCart();
      renderCart();
    }

    function openCart(){ document.getElementById('cartPanel').classList.remove('hidden'); renderCart(); }
    function closeCart(){ document.getElementById('cartPanel').classList.add('hidden'); }

    function renderCart(){
      cartItems.innerHTML = cart.length ? cart.map((i,idx)=>`<div class="bg-slate-50 border rounded-2xl p-3 flex justify-between gap-3"><div><div class="font-semibold">${i.name}</div><div class="text-slate-500">Talla ${i.size} • SKU ${i.sku}</div></div><div class="font-bold">${fmt(i.price)}</div></div>`).join('') : '<div class="text-slate-500">Tu carrito está vacío.</div>';
      cartTotal.textContent = fmt(cart.reduce((s,i)=>s+(i.price*i.qty),0));
      connectionStatus.textContent = 'Conexión lista para generar el pago.';
      const btn = document.getElementById('btn-checkout');
      btn.style.display = cart.length ? 'flex' : 'none';
    }

    async function checkout(){
      if (!cart.length) return alert('¡Tu carrito está vacío!');
      const btn = document.getElementById('btn-checkout');
      const original = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERANDO PAGO...';
      btn.disabled = true;
      const name = prompt('Tu nombre completo:') || 'Cliente Web';
      const phone = prompt('Tu número de WhatsApp:') || '';
      const addr = prompt('Dirección de entrega (Ciudad y Barrio):') || '';
      const total = cart.reduce((s,i)=>s+(i.price*i.qty),0);
      const orderId = 'KOOL-' + Date.now();
      const robustDesc = cart.map(i => `[ORD:${orderId} | SKU:${i.sku} | SZ:${i.size} | NAME:${i.name} | CLR:${i.color}]`).join(' ');
      try {
        const response = await fetch('https://bold-bridge-7qge-6pdxknayx-lhvlhv13-1274s-projects.vercel.app/api/checkout', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ amount: total, label: 'Calzado Kool ' + orderId, description: robustDesc + ' | ENVIO: ' + addr, order_id: orderId })
        });
        if (!response.ok) throw new Error('error de conexión');
        const data = await response.json();
        if (data.url) {
          const waText = `🚀 *NUEVO PEDIDO WEB (CALZADO KOOL)*\n${cart.map(i=>`- ${i.qty}x ${i.name} (Talla ${i.size})`).join('\n')}\n\n💰 *Total: ${fmt(total)}*\n\n👤 Cliente: ${name}\n📱 Cel: ${phone}\n📍 Envío: ${addr}\n🆔 Orden: ${orderId}`;
          setTimeout(()=>window.open(`https://wa.me/573057778133?text=${encodeURIComponent(waText)}`,'_blank'), 300);
          window.location.href = data.url;
        } else throw new Error('no url');
      } catch (e) {
        alert('❌ Error de conexión: no pudimos contactar a la pasarela de pagos.');
        btn.innerHTML = original;
        btn.disabled = false;
        connectionStatus.textContent = 'No se pudo contactar el servicio de pagos.';
      }
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>

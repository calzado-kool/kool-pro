<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calzado Kool - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
        .btn-buy { background: linear-gradient(90deg, #ff8c00, #ff4500); color: white; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; margin-top: 8px; }
        #modal { transition: transform 0.3s ease-out; }
        .size-btn.selected { border-color: #ea580c; background-color: #fff7ed; color: #ea580c; }
    </style>
</head>
<body class="pb-20">

    <!-- Navbar -->
    <nav class="bg-white px-4 py-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-black italic tracking-tighter uppercase">Calzado <span class="text-orange-600">Kool</span></h1>
        <div class="flex gap-4">
            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
            <div class="relative">
                <i class="fa-solid fa-cart-shopping text-gray-800"></i>
                <span class="absolute -top-2 -right-2 bg-orange-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <!-- Promo Banner -->
    <div class="px-4 mt-4">
        <div class="bg-orange-600 rounded-2xl p-6 text-white flex justify-between items-center overflow-hidden relative">
            <div>
                <p class="text-xs font-bold uppercase opacity-80">Nueva Temporada</p>
                <h2 class="text-2xl font-black uppercase leading-tight">Envío Gratis <br>Hoy</h2>
            </div>
            <i class="fa-solid fa-truck-fast text-5xl opacity-20 absolute -right-2"></i>
        </div>
    </div>

    <!-- Title Section -->
    <div class="px-4 mt-6">
        <h3 class="text-lg font-extrabold text-gray-900 uppercase tracking-tight">Catálogo General</h3>
        <p class="text-xs text-gray-500">Más de 50 modelos disponibles</p>
    </div>

    <!-- Product Grid -->
    <div class="product-grid">
        <!-- Item 1 -->
        <div class="card" onclick="openModal('Carbon White Premium', 145000, 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600', ['35', '36', '37', '38'])">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" class="h-44 w-full object-cover">
            <div class="p-3">
                <p class="text-[10px] font-bold text-orange-600 uppercase">Urban Style</p>
                <h4 class="text-sm font-bold text-gray-800 truncate">Carbon White Premium</h4>
                <p class="text-lg font-black text-gray-900 mt-1">$145.000</p>
                <button class="btn-buy mt-2">Comprar</button>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="card" onclick="openModal('Carbon Red Sport', 185000, 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600', ['36', '37', '38', '39'])">
            <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600" class="h-44 w-full object-cover">
            <div class="p-3">
                <p class="text-[10px] font-bold text-orange-600 uppercase">Sport Pro</p>
                <h4 class="text-sm font-bold text-gray-800 truncate">Carbon Red Sport</h4>
                <p class="text-lg font-black text-gray-900 mt-1">$185.000</p>
                <button class="btn-buy mt-2">Comprar</button>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="card" onclick="openModal('Kool Urban Blue', 165000, 'https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=600', ['37', '38', '39', '40'])">
            <img src="https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=600" class="h-44 w-full object-cover">
            <div class="p-3">
                <p class="text-[10px] font-bold text-orange-600 uppercase">Street Edition</p>
                <h4 class="text-sm font-bold text-gray-800 truncate">Kool Urban Blue</h4>
                <p class="text-lg font-black text-gray-900 mt-1">$165.000</p>
                <button class="btn-buy mt-2">Comprar</button>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="card" onclick="openModal('Black Onyx Lux', 195000, 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600', ['38', '39', '40', '41'])">
            <img src="https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600" class="h-44 w-full object-cover">
            <div class="p-3">
                <p class="text-[10px] font-bold text-orange-600 uppercase">Premium Class</p>
                <h4 class="text-sm font-bold text-gray-800 truncate">Black Onyx Lux</h4>
                <p class="text-lg font-black text-gray-900 mt-1">$195.000</p>
                <button class="btn-buy mt-2">Comprar</button>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-end">
        <div id="modal" class="bg-white w-full rounded-t-3xl p-6 transform translate-y-full transition-transform">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
            
            <div class="flex gap-4 mb-6">
                <img id="mImg" class="w-24 h-24 rounded-xl object-cover bg-gray-100 shadow-sm">
                <div>
                    <h2 id="mTitle" class="text-xl font-extrabold text-gray-900 leading-tight"></h2>
                    <p id="mPrice" class="text-orange-600 font-black text-lg"></p>
                    <div class="flex items-center gap-1 mt-1">
                        <i class="fa-solid fa-star text-yellow-400 text-[10px]"></i>
                        <i class="fa-solid fa-star text-yellow-400 text-[10px]"></i>
                        <i class="fa-solid fa-star text-yellow-400 text-[10px]"></i>
                        <i class="fa-solid fa-star text-yellow-400 text-[10px]"></i>
                        <i class="fa-solid fa-star text-yellow-400 text-[10px]"></i>
                        <span class="text-[10px] text-gray-400 font-bold ml-1">4.9 (120 reviews)</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-2">Selecciona tu Talla</label>
                    <div id="mSizes" class="flex gap-2 flex-wrap">
                        <!-- Botones de talla dinámicos -->
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <input type="text" id="cName" placeholder="Nombre completo" class="w-full bg-gray-50 rounded-xl px-4 py-3 text-sm border-none focus:ring-2 focus:ring-orange-600 outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="cId" placeholder="Cédula" class="bg-gray-50 rounded-xl px-4 py-3 text-sm border-none focus:ring-2 focus:ring-orange-600 outline-none">
                        <input type="text" id="cPhone" placeholder="Celular" class="bg-gray-50 rounded-xl px-4 py-3 text-sm border-none focus:ring-2 focus:ring-orange-600 outline-none">
                    </div>
                    <input type="text" id="cAddr" placeholder="Dirección de envío completa" class="w-full bg-gray-50 rounded-xl px-4 py-3 text-sm border-none focus:ring-2 focus:ring-orange-600 outline-none">
                </div>
                
                <button onclick="sendOrder()" class="w-full bg-black text-white py-4 rounded-2xl font-black text-lg shadow-xl mt-4 active:scale-95 transition-all">
                    CONFIRMAR PEDIDO
                </button>
                <button onclick="closeModal()" class="w-full text-gray-400 text-xs font-bold py-2 uppercase tracking-widest">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let product = null;
        let size = null;

        function openModal(name, price, img, sizes) {
            product = { name, price, img };
            document.getElementById('mTitle').innerText = name;
            document.getElementById('mPrice').innerText = '$' + price.toLocaleString('es-CO');
            document.getElementById('mImg').src = img;
            
            const sCont = document.getElementById('mSizes');
            sCont.innerHTML = '';
            sizes.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'size-btn w-12 h-12 border-2 rounded-xl text-sm font-bold transition-all';
                btn.innerText = s;
                btn.onclick = () => {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    size = s;
                };
                sCont.appendChild(btn);
            });

            document.getElementById('modalOverlay').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal').style.transform = 'translateY(0)';
            }, 10);
        }

        function closeModal() {
            document.getElementById('modal').style.transform = 'translateY(100%)';
            setTimeout(() => {
                document.getElementById('modalOverlay').classList.add('hidden');
            }, 300);
        }

        function sendOrder() {
            const name = document.getElementById('cName').value;
            const id = document.getElementById('cId').value;
            const phone = document.getElementById('cPhone').value;
            const addr = document.getElementById('cAddr').value;

            if(!size) return alert('Por favor elige una talla');
            if(!name || !id || !phone || !addr) return alert('Por favor completa todos los datos');

            const text = `Hola! Quiero comprar:
👟 *${product.name}*
📏 Talla: ${size}
👤 Cliente: ${name}
🆔 CC: ${id}
📱 Cel: ${phone}
📍 Dirección: ${addr}
---
🔄 *Procesando pago Bold...*`;

            const wa = `https://wa.me/573057778133?text=${encodeURIComponent(text)}`;
            const bold = "https://checkout.bold.co/payment/LNK_C41NH1MPJA";

            window.open(wa, '_blank');
            window.location.href = bold;
        }
    </script>
</body>
</html>

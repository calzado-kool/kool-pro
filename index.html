<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calzado Kool — Pro App</title>
    <style>
        :root { --primary: #1a1a2e; --accent: #ff6a00; --bg: #f8f9fa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--primary); padding-bottom: 20px; }
        .header { background: var(--primary); color: #fff; padding: 15px; text-align: center; font-weight: 900; font-size: 18px; position: sticky; top:0; z-index: 1000; }
        .product-card { background: #fff; margin: 15px; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .img-box img { width: 100%; height: auto; display: block; }
        .info { padding: 20px; }
        .title { font-size: 20px; font-weight: 900; margin-bottom: 5px; }
        .price { font-size: 22px; font-weight: 900; color: var(--accent); margin-bottom: 15px; }
        .tallas-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .talla-btn { border: 2px solid #eee; padding: 10px; text-align: center; border-radius: 10px; cursor: pointer; font-weight: 800; }
        .talla-btn.active { border-color: var(--accent); background: #fff8f4; color: var(--accent); }
        .btn-pay { background: var(--accent); color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: 900; font-size: 16px; cursor: pointer; display: block; text-align: center; text-decoration: none; }
        #form-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .form-content { background: #fff; width: 100%; max-width: 400px; border-radius: 20px; padding: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: #666; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; outline: none; }
    </style>
</head>
<body>
<div class="header">CALZADO KOOL — PRO</div>
<div class="product-card">
    <div class="img-box"><img src="https://site.zapia.com/ykeuyd2f/carbon-white.jpg"></div>
    <div class="info">
        <p class="title">Carbon White</p>
        <p class="price">$145.000</p>
        <div class="tallas-grid">
            <div class="talla-btn" onclick="setT(35, this)">35</div>
            <div class="talla-btn" onclick="setT(36, this)">36</div>
            <div class="talla-btn" onclick="setT(37, this)">37</div>
            <div class="talla-btn" onclick="setT(38, this)">38</div>
        </div>
        <button class="btn-pay" onclick="openM()">PAGAR AHORA</button>
    </div>
</div>
<div id="form-modal"><div class="form-content">
    <h3 style="margin-bottom:15px">Datos de Envío</h3>
    <div class="input-group"><label>Nombre</label><input id="nom" placeholder="Ej: Leonardo"></div>
    <div class="input-group"><label>Cédula</label><input id="ced" type="number"></div>
    <div class="input-group"><label>Celular</label><input id="cel" type="number"></div>
    <div class="input-group"><label>Dirección</label><input id="dir" placeholder="Ciudad, Barrio, Calle"></div>
    <button class="btn-pay" onclick="c()">ENVIAR Y PAGAR 🚀</button>
    <p onclick="closeM()" style="text-align: center; margin-top: 15px; font-size: 13px; color: #999; cursor: pointer;">Cancelar</p>
</div></div>
<script>
let tS = null;
function setT(t, e) { tS=t; document.querySelectorAll(".talla-btn").forEach(b=>b.classList.remove("active")); e.classList.add("active"); }
function openM() { if(!tS) return alert("Por favor elige una talla."); document.getElementById("form-modal").style.display="flex"; }
function closeM() { document.getElementById("form-modal").style.display="none"; }
function c() {
    const n=document.getElementById("nom").value, c=document.getElementById("ced").value, l=document.getElementById("cel").value, d=document.getElementById("dir").value;
    if(!n||!c||!l||!d) return alert("Por favor completa todos los datos.");
    const msg = `🚀 NUEVO PEDIDO PRO\n---------------------------\n👟 Producto: Carbon White\n📏 Talla: ${tS}\n👤 Cliente: ${n}\n🆔 CC: ${c}\n📱 Cel: ${l}\n📍 Dir: ${d}\n---------------------------\n💳 Estado: Pagando en Bold.`;
    window.open("https://checkout.bold.co/payment/LNK_C41NH1MPJA", "_blank");
    window.location.href = `https://wa.me/573057778133?text=${encodeURIComponent(msg)}`;
}
</script>
</body>
</html>

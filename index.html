<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALZADO KOOL | Tienda Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; scroll-behavior: smooth; }
    .kool-card { background: white; border: 1px solid #eee; border-radius: 28px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .kool-card:hover { transform: translateY(-8px); border-color: #f97316; box-shadow: 0 30px 60px rgba(0,0,0,0.08); }
    .grad { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
    .size-btn { border: 2px solid #f0f0f0; border-radius: 14px; transition: all 0.2s; cursor: pointer; }
    .size-btn.active { border-color: #ea580c; background: #fff7ed; color: #ea580c; font-weight: 800; transform: scale(1.05); }
    .size-btn.disabled { opacity: 0.2; cursor: not-allowed; background: #fafafa; }
    .btn-main { background: #1a1a1a; color: white; border-radius: 16px; transition: all 0.3s; }
    .btn-main:hover { background: #ea580c; transform: scale(1.02); box-shadow: 0 10px 20px rgba(234, 88, 12, 0.2); }
    .sidebar { position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 420px; background: white; z-index: 1000; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -15px 0 40px rgba(0,0,0,0.06); }
    .sidebar.open { transform: translateX(0); }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .input-kool { width: 100%; padding: 14px 18px; border: 1.5px solid #eee; border-radius: 14px; outline: none; transition: 0.2s; background: #fafafa; }
    .input-kool:focus { border-color: #ea580c; background: white; box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.1); }
    .qty-badge { background: #ea580c; color: white; font-size: 10px; font-weight: 800; border-radius: 99px; padding: 2px 6px; }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN -->
  <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 grad rounded-2xl flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-shoe-prints text-xl"></i></div>
        <div>
          <span class="text-xl font-black tracking-tighter block leading-none">CALZADO KOOL</span>
          <span class="text-[9px] uppercase tracking-widest text-orange-600 font-extrabold">IA Operativa</span>
        </div>
      </div>
      <div class="flex gap-4">
        <button onclick="localStorage.removeItem('kool_cart_v3'); location.reload();" class="text-[10px] font-bold text-gray-400 hover:text-red-500 uppercase tracking-widest transition-colors">Limpiar</button>
        <button onclick="toggleCart(true)" class="relative p-2 text-gray-800 hover:text-orange-600 transition-transform active:scale-90">
          <i class="fa-solid fa-bag-shopping text-2xl"></i>
          <span id="badge" class="absolute -top-1 -right-1 w-5 h-5 grad text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white scale-0 transition-transform">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- CATÁLOGO -->
  <main class="max-w-7xl mx-auto px-6 py-12 md:py-20">
    <div class="mb-16 text-center md:text-left">
      <h1 class="text-5xl font-black mb-4 tracking-tight">Tu Estilo, Tu <span class="text-orange-600">Paso</span>.</h1>
      <p class="text-gray-500 max-w-xl text-lg">Explora nuestra colección premium con stock real sincronizado. Agrega lo que te gusta y paga seguro con Bold.</p>
    </div>

    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-12">
      <!-- Los productos se cargan aquí -->
    </div>
  </main>

  <!-- CARRITO SIDEBAR -->
  <div id="overlay" class="overlay" onclick="toggleCart(false)"></div>
  <div id="cart" class="sidebar flex flex-col">
    <div class="p-8 border-b flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-black">Tu Carrito</h2>
        <p class="text-xs text-gray-400 font-bold uppercase tracking-widest mt-1">Sincronizado por IA</p>
      </div>
      <button onclick="toggleCart(false)" class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:text-black hover:bg-gray-100 transition-all"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div id="cart-items" class="flex-grow overflow-y-auto p-8 space-y-6">
      <!-- Items del carrito -->
    </div>

    <div id="form-section" class="p-8 border-t bg-gray-50/80 space-y-6">
      <div id="client-form" class="space-y-4">
        <div class="flex items-center gap-2 mb-2">
          <div class="w-2 h-6 grad rounded-full"></div>
          <h3 class="font-black text-gray-800 uppercase text-xs tracking-widest">Datos de Entrega</h3>
        </div>
        <input type="text" id="name" placeholder="Tu nombre completo" class="input-kool">
        <input type="tel" id="phone" placeholder="WhatsApp (Ej: 305...)" class="input-kool">
        <textarea id="addr" placeholder="Dirección completa, Ciudad y Barrio" class="input-kool h-24 resize-none"></textarea>
      </div>

      <div class="flex justify-between items-center text-2xl font-black pt-4">
        <span class="text-gray-400 text-sm uppercase tracking-widest">Total a pagar</span>
        <span id="total" class="text-orange-600">$0</span>
      </div>

      <button id="btn-pay" onclick="App.checkout()" class="w-full py-5 grad text-white font-black text-lg rounded-2xl shadow-xl shadow-orange-200 hover:scale-[1.03] active:scale-95 transition-all flex items-center justify-center gap-3">
        <span>FINALIZAR Y PAGAR</span> <i class="fa-solid fa-shield-check"></i>
      </button>
      <p class="text-[10px] text-center text-gray-400 uppercase font-bold tracking-tighter">🔒 Pago procesado por Bold • IA Kool verifica tu pedido</p>
    </div>
  </div>

  <script>
    const App = {
      // BRIDGE URL ACTUALIZADA Y FUNCIONAL
      BRIDGE: 'https://bold-bridge-7qge.vercel.app/api/checkout',
      
      products: [
        { id:'p1', name:'Bota Urbana Roja', price:160000, img:'img/bota_roja.jpg', desc:'Bota táctica de alto rendimiento, resistente y ligera.', stock:{'34':1,'35':2,'36':0,'37':1,'38':3,'39':1}, skus:{'34':'020','35':'021','36':'022','37':'023','38':'024','39':'025'} },
        { id:'p2', name:'Tractor Power', price:160000, img:'img/tractor_power.jpg', desc:'Resistencia máxima para trabajo pesado y montaña.', stock:{'34':2,'36':1,'37':4,'38':2,'39':5,'40':2}, skus:{'34':'TR34','36':'TR36','37':'TR37','38':'TR38','39':'TR39','40':'TR40'} },
        { id:'p3', name:'Tenis Premium Edition', price:145000, img:'img/tenis_premium.jpg', desc:'Elegancia y confort en cada paso. Diseño exclusivo.', stock:{'35':3,'36':5,'37':2,'38':4,'39':1}, skus:{'35':'TP35','36':'TP36','37':'TP37','38':'TP38','39':'TP39'} },
        { id:'p4', name:'Sneakers Urban', price:145000, img:'img/sneakers_urban.jpg', desc:'Estilo versátil para el día a día en la ciudad.', stock:{'34':2,'35':1,'36':3,'37':2,'38':4,'39':2}, skus:{'34':'SU34','35':'SU35','36':'SU36','37':'SU37','38':'SU38','39':'SU39'} }
      ],
      
      cart: [],
      sel: {},

      init() {
        // Carga robusta de carrito
        try {
          const stored = localStorage.getItem('kool_cart_v3');
          this.cart = stored ? JSON.parse(stored) : [];
          if (!Array.isArray(this.cart)) this.cart = [];
        } catch(e) { this.cart = []; }
        
        this.renderCatalog();
        this.renderCart();
      },

      fmt(v) { return '$' + Number(v).toLocaleString('es-CO'); },

      renderCatalog() {
        const container = document.getElementById('grid');
        container.innerHTML = this.products.map(p => `
          <div class="kool-card overflow-hidden flex flex-col h-full">
            <div class="aspect-square bg-gray-100 overflow-hidden relative group">
              <img src="${p.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
              <div class="absolute top-6 left-6 bg-white/95 backdrop-blur-xl px-4 py-1.5 rounded-full text-[10px] font-black uppercase text-gray-800 shadow-xl border border-white/20">EDICIÓN 2026</div>
            </div>
            <div class="p-8 flex flex-col justify-between flex-grow space-y-8">
              <div>
                <h2 class="text-3xl font-black text-gray-900 tracking-tight">${p.name}</h2>
                <p class="text-orange-600 font-extrabold text-2xl mt-2">${this.fmt(p.price)}</p>
                <p class="text-gray-400 text-sm mt-4 leading-relaxed line-clamp-2">${p.desc}</p>
              </div>
              
              <div class="space-y-4">
                <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-gray-400">
                  <span>Seleccionar Talla</span>
                  <span>Disponibles</span>
                </div>
                <div class="grid grid-cols-3 gap-3">
                  ${Object.entries(p.stock).map(([s, q]) => {
                    const ok = q > 0;
                    return `
                      <button onclick="${ok ? `App.select('${p.id}', '${s}')` : ''}" 
                              id="btn-${p.id}-${s}" 
                              class="size-btn p-4 flex flex-col items-center gap-1 ${!ok ? 'disabled' : 'hover:border-orange-200'}">
                        <span class="text-xl font-black text-gray-800">${s}</span>
                        <span class="text-[9px] font-black ${q < 3 ? 'text-red-500' : 'text-gray-300'}">${ok ? q + ' UDS' : 'AGOTADO'}</span>
                      </button>`;
                  }).join('')}
                </div>
              </div>

              <button onclick="App.add('${p.id}')" class="btn-main w-full py-5 font-black text-sm shadow-2xl flex items-center justify-center gap-3">
                <i class="fa-solid fa-cart-plus text-lg"></i> AGREGAR AL CARRITO
              </button>
            </div>
          </div>
        `).join('');
      },

      select(pid, s) {
        this.sel[pid] = s;
        document.querySelectorAll(\`[id^="btn-\${pid}-"]\`).forEach(b => b.classList.remove('active'));
        document.getElementById(\`btn-\${pid}-\${s}\`).classList.add('active');
      },

      add(pid) {
        const s = this.sel[pid];
        if(!s) return alert('Por favor, toca una talla antes de agregar.');
        const p = this.products.find(x => x.id === pid);
        const item = this.cart.find(i => i.id === pid && i.size === s);
        
        if(item) {
          if(item.qty >= p.stock[s]) return alert('⚠️ Límite alcanzado: No hay más stock de esta talla.');
          item.qty++;
        } else {
          this.cart.push({ id:p.id, name:p.name, price:p.price, size:s, sku:p.skus[s], img:p.img, qty:1, stockLimit: p.stock[s] });
        }
        this.save();
        toggleCart(true);
      },

      save() {
        localStorage.setItem('kool_cart_v3', JSON.stringify(this.cart));
        this.renderCart();
      },

      renderCart() {
        const list = document.getElementById('cart-items');
        const count = this.cart.reduce((s,i) => s + i.qty, 0);
        const total = this.cart.reduce((s,i) => s + (i.price * i.qty), 0);
        
        const b = document.getElementById('badge');
        b.textContent = count;
        b.classList.toggle('scale-0', count === 0);
        b.classList.toggle('scale-100', count > 0);
        
        document.getElementById('total').textContent = this.fmt(total);

        if(!this.cart.length) {
          list.innerHTML = `
            <div class="text-center py-20">
              <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-cart-shopping text-4xl text-gray-200"></i>
              </div>
              <p class="font-bold text-gray-400 uppercase text-xs tracking-widest">Tu carrito está vacío</p>
            </div>`;
          document.getElementById('client-form').classList.add('hidden');
          document.getElementById('btn-pay').classList.add('hidden');
          return;
        }

        document.getElementById('client-form').classList.remove('hidden');
        document.getElementById('btn-pay').classList.remove('hidden');
        
        list.innerHTML = this.cart.map((i, idx) => `
          <div class="flex gap-5 p-5 bg-white border border-gray-100 rounded-[2rem] shadow-sm hover:shadow-md transition-shadow">
            <img src="${i.img}" class="w-20 h-20 rounded-2xl object-cover shadow-sm">
            <div class="flex-grow flex flex-col justify-between">
              <div class="flex justify-between items-start">
                <div>
                  <h4 class="font-black text-sm text-gray-900 leading-tight">${i.name}</h4>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="text-[9px] font-black text-orange-600 bg-orange-50 px-2 py-0.5 rounded uppercase">Talla ${i.size}</span>
                    <span class="text-[9px] font-bold text-gray-300 uppercase tracking-widest">SKU ${i.sku}</span>
                  </div>
                </div>
                <button onclick="App.remove(${idx})" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-300 hover:text-red-500 hover:bg-red-50 transition-all"><i class="fa-solid fa-trash-can text-xs"></i></button>
              </div>
              <div class="flex justify-between items-center mt-4">
                <div class="flex items-center gap-4 bg-gray-50 rounded-2xl px-4 py-2 font-black text-sm">
                  <button onclick="App.qty(${idx},-1)" class="text-gray-400 hover:text-orange-600"><i class="fa-solid fa-minus"></i></button>
                  <span class="w-4 text-center">${i.qty}</span>
                  <button onclick="App.qty(${idx},1)" class="text-gray-400 hover:text-orange-600"><i class="fa-solid fa-plus"></i></button>
                </div>
                <span class="font-black text-lg text-gray-900">${this.fmt(i.price * i.qty)}</span>
              </div>
            </div>
          </div>
        `).join('');
      },

      qty(idx, d) {
        const i = this.cart[idx];
        if(d > 0 && i.qty >= i.stockLimit) return alert('⚠️ No hay más unidades disponibles.');
        i.qty += d;
        if(i.qty <= 0) this.cart.splice(idx, 1);
        this.save();
      },

      remove(idx) { this.cart.splice(idx, 1); this.save(); },

      async checkout() {
        const n = document.getElementById('name').value.trim();
        const p = document.getElementById('phone').value.trim();
        const a = document.getElementById('addr').value.trim();
        if(!n || !p || !a) return alert('⚠️ Por favor completa tus datos de entrega.');

        const btn = document.getElementById('btn-pay');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERANDO PAGO SEGURO...';

        const oid = 'KOOL-' + Date.now();
        const total = this.cart.reduce((s,i) => s + (i.price * i.qty), 0);
        // Formato IA: [ORD:ID | SKU:CODE | SZ:SIZE | NAME:NAME | QTY:QTY]
        const desc = this.cart.map(i => `[ORD:${oid} | SKU:${i.sku} | SZ:${i.size} | NAME:${i.name} | QTY:${i.qty}]`).join(' ');

        try {
          const res = await fetch(this.BRIDGE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: total, label: 'PEDIDO KOOL '+oid, description: desc + ' | ENVIO: ' + a, order_id: oid })
          });
          if(!res.ok) throw 'err';
          const data = await res.json();
          if(data.url) {
            const itemsList = this.cart.map(i => `✅ ${i.qty}x ${i.name} (T${i.size})`).join('%0A');
            const wa = `👟 *NUEVO PEDIDO KOOL*%0A%0A🆔 *Orden:* ${oid}%0A%0A📦 *Productos:*%0A${itemsList}%0A%0A💰 *Total:* ${this.fmt(total)}%0A👤 *Cliente:* ${n}%0A📱 *WhatsApp:* ${p}%0A📍 *Envío:* ${a}`;
            window.open(`https://wa.me/573057778133?text=${wa}`, '_blank');
            setTimeout(() => window.location.href = data.url, 800);
          } else throw 'err';
        } catch(e) {
          alert('❌ Hubo un problema con la pasarela. Intenta de nuevo.');
          btn.disabled = false;
          btn.innerHTML = orig;
        }
      }
    };

    function toggleCart(open) {
      document.getElementById('cart').classList.toggle('open', open);
      document.getElementById('overlay').classList.toggle('open', open);
    }

    App.init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calzado Kool - Pro Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .product-card { transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }
        .btn-gradient { background: linear-gradient(90deg, #ff8c00, #ff4500); }
    </style>
</head>
<body class="pb-24">
    <!-- Header -->
    <header class="sticky top-0 bg-white shadow-sm z-50 px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-extrabold tracking-tighter text-gray-900">CALZADO <span class="text-orange-600">KOOL</span></h1>
        <div class="flex gap-4 text-gray-500">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bag-shopping"></i>
        </div>
    </header>

    <!-- Banner -->
    <div class="px-4 py-4">
        <div class="bg-black rounded-2xl p-6 text-white relative overflow-hidden h-40 flex flex-col justify-center">
            <h2 class="text-2xl font-bold z-10">Nueva Colección</h2>
            <p class="text-gray-400 z-10">Premium Sneakers 2026</p>
            <button class="mt-2 bg-orange-600 text-white px-4 py-1 rounded-full text-sm font-bold w-fit z-10">Ver más</button>
            <div class="absolute -right-4 -bottom-4 opacity-20 transform -rotate-12">
                <i class="fa-solid fa-shoe-prints text-9xl"></i>
            </div>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="px-4 grid grid-cols-2 gap-4">
        <!-- Product 1 -->
        <div class="product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" onclick="openCheckout('Carbon White', 145000, 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500')">
            <div class="relative h-40 bg-gray-50">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" class="w-full h-full object-cover">
                <div class="absolute top-2 left-2 bg-black text-white text-[10px] font-bold px-2 py-1 rounded">-25%</div>
            </div>
            <div class="p-3">
                <h3 class="text-sm font-semibold text-gray-800 truncate">Carbon White Premium</h3>
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-lg font-bold text-orange-600">$145k</span>
                    <span class="text-xs text-gray-400 line-through">$195k</span>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden" onclick="openCheckout('Carbon Red', 185000, 'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500')">
            <div class="relative h-40 bg-gray-50">
                <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500" class="w-full h-full object-cover">
                <div class="absolute top-2 left-2 bg-orange-600 text-white text-[10px] font-bold px-2 py-1 rounded">HOT</div>
            </div>
            <div class="p-3">
                <h3 class="text-sm font-semibold text-gray-800 truncate">Carbon Red Sport</h3>
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-lg font-bold text-orange-600">$185k</span>
                    <span class="text-xs text-gray-400 line-through">$220k</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-6 animate-slide-up">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
            
            <div class="flex gap-4 mb-6">
                <img id="modalImg" class="w-24 h-24 rounded-xl object-cover bg-gray-100">
                <div>
                    <h2 id="modalTitle" class="text-xl font-bold text-gray-900"></h2>
                    <p id="modalPrice" class="text-orange-600 font-bold text-lg"></p>
                    <p class="text-xs text-gray-500">Envío gratis a todo el país</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase mb-1 block">Talla</label>
                    <div class="flex gap-2" id="sizeSelector">
                        <button onclick="selectSize(this)" class="w-10 h-10 border rounded-lg text-sm font-bold border-orange-600 bg-orange-50 text-orange-600">36</button>
                        <button onclick="selectSize(this)" class="w-10 h-10 border rounded-lg text-sm font-bold">37</button>
                        <button onclick="selectSize(this)" class="w-10 h-10 border rounded-lg text-sm font-bold">38</button>
                        <button onclick="selectSize(this)" class="w-10 h-10 border rounded-lg text-sm font-bold">39</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="custName" placeholder="Nombre completo" class="w-full border-b py-2 text-sm focus:border-orange-600 outline-none">
                    <input type="text" id="custId" placeholder="Cédula" class="w-full border-b py-2 text-sm focus:border-orange-600 outline-none">
                </div>
                <input type="text" id="custAddr" placeholder="Dirección de envío" class="w-full border-b py-2 text-sm focus:border-orange-600 outline-none">
                
                <button onclick="confirmPurchase()" class="w-full btn-gradient text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-orange-200 mt-4">
                    Confirmar y Pagar
                </button>
                <button onclick="closeCheckout()" class="w-full text-gray-400 text-sm font-medium py-2">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let currentProduct = null;
        let selectedSize = '36';

        function openCheckout(name, price, img) {
            currentProduct = { name, price, img };
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = '$' + (price/1000).toFixed(0) + '.000';
            document.getElementById('modalImg').src = img;
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        function selectSize(btn) {
            document.querySelectorAll('#sizeSelector button').forEach(b => {
                b.classList.remove('border-orange-600', 'bg-orange-50', 'text-orange-600');
            });
            btn.classList.add('border-orange-600', 'bg-orange-50', 'text-orange-600');
            selectedSize = btn.innerText;
        }

        function confirmPurchase() {
            const name = document.getElementById('custName').value;
            const addr = document.getElementById('custAddr').value;
            const id = document.getElementById('custId').value;

            if(!name || !addr || !id) {
                alert('Por favor completa todos los datos de envío');
                return;
            }

            const msg = `Hola! Quiero comprar:
👟 *${currentProduct.name}*
📏 Talla: ${selectedSize}
👤 Cliente: ${name}
🆔 CC: ${id}
📍 Dir: ${addr}`;

            const waUrl = `https://wa.me/573057778133?text=${encodeURIComponent(msg)}`;
            const boldUrl = "https://checkout.bold.co/payment/LNK_C41NH1MPJA";

            window.open(waUrl, '_blank');
            window.location.href = boldUrl;
        }
    </script>

    <style>
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
    </style>
</body>
</html>

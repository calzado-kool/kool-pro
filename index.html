<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calzado Kool - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
        .btn-buy { background: linear-gradient(90deg, #ff8c00, #ff4500); color: white; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; margin-top: 8px; }
        .size-btn.selected { border-color: #ea580c; background-color: #fff7ed; color: #ea580c; }
        #zoomModal img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
    </style>
</head>
<body class="pb-24">

    <!-- Navbar -->
    <nav class="bg-white px-4 py-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-black italic tracking-tighter uppercase">Calzado <span class="text-orange-600">Kool</span></h1>
        <div class="flex gap-4 items-center">
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <i class="fa-solid fa-cart-shopping text-gray-800 text-xl"></i>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-orange-600 text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
            </div>
        </div>
    </nav>

    <!-- Product Grid -->
    <div class="product-grid">
        <div class="card">
            <div class="relative">
                <img src="img/boots_yellow.jpg" class="h-48 w-full object-cover cursor-zoom-in" onclick="zoomImage('img/boots_yellow.jpg')">
                <div class="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded-lg text-[10px] font-black text-gray-900 shadow-sm">NUEVO</div>
            </div>
            <div class="p-3">
                <p class="text-[10px] font-bold text-orange-600 uppercase">Outdoor Series</p>
                <h4 class="text-sm font-bold text-gray-800">Tractor Power</h4>
                <p class="text-lg font-black text-gray-900 mt-1">$160.000</p>
                <button onclick="openProduct('Tractor Power', 160000, 'img/boots_yellow.jpg', ['34', '35', '37', '38', '39', '41', '42'])" class="btn-buy mt-2">Agregar</button>
            </div>
        </div>
    </div>

    <!-- Zoom Image Modal -->
    <div id="zoomModal" class="fixed inset-0 bg-black/90 z-[200] hidden flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
        <img id="zoomImg" src="" alt="Zoom">
        <button class="absolute top-6 right-6 text-white text-2xl"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- Product Options Modal -->
    <div id="productModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-end">
        <div class="bg-white w-full rounded-t-3xl p-6 transform transition-transform translate-y-0">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
            <div class="flex gap-4 mb-6">
                <img id="modalImg" class="w-24 h-24 rounded-xl object-cover bg-gray-50">
                <div>
                    <h2 id="modalTitle" class="text-xl font-extrabold text-gray-900"></h2>
                    <p id="modalPrice" class="text-orange-600 font-black text-lg"></p>
                </div>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-3">Selecciona Talla</label>
                    <div id="modalSizes" class="flex gap-2 flex-wrap"></div>
                </div>
                <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl">
                    <span class="text-sm font-bold text-gray-500">Cantidad</span>
                    <div class="flex items-center gap-4">
                        <button onclick="changeQty(-1)" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center font-bold">-</button>
                        <span id="itemQty" class="font-black text-lg">1</span>
                        <button onclick="changeQty(1)" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center font-bold">+</button>
                    </div>
                </div>
                <button onclick="addToCart()" class="w-full bg-black text-white py-4 rounded-2xl font-black text-lg shadow-xl active:scale-95 transition-all">
                    AÑADIR AL CARRITO
                </button>
                <button onclick="closeProduct()" class="w-full text-gray-400 text-xs font-bold py-2 uppercase tracking-widest">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar/Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 z-[150] hidden flex items-end">
        <div class="bg-white w-full h-[85vh] rounded-t-3xl p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black italic uppercase">Tu <span class="text-orange-600">Carrito</span></h2>
                <button onclick="toggleCart()" class="text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cartItems" class="space-y-4 mb-8"></div>
            
            <div class="border-t pt-6 space-y-4">
                <div class="bg-gray-50 rounded-2xl p-4 space-y-3">
                    <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Datos de Envío</p>
                    <input type="text" id="cName" placeholder="Nombre completo" class="w-full bg-white rounded-xl px-4 py-3 text-sm outline-none border border-gray-100">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="cId" placeholder="Cédula" class="bg-white rounded-xl px-4 py-3 text-sm outline-none border border-gray-100">
                        <input type="text" id="cPhone" placeholder="Celular" class="bg-white rounded-xl px-4 py-3 text-sm outline-none border border-gray-100">
                    </div>
                    <input type="text" id="cAddr" placeholder="Dirección completa" class="w-full bg-white rounded-xl px-4 py-3 text-sm outline-none border border-gray-100">
                </div>
                <div class="flex justify-between items-center px-2">
                    <span class="text-gray-500 font-bold">Total a pagar:</span>
                    <span id="cartTotal" class="text-2xl font-black text-orange-600"></span>
                </div>
                <button onclick="checkout()" class="w-full bg-orange-600 text-white py-5 rounded-2xl font-black text-xl shadow-xl shadow-orange-200 active:scale-95 transition-all">
                    CONFIRMAR Y PAGAR
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let currentProduct = null;
        let selectedSize = null;
        let currentQty = 1;

        function zoomImage(src) {
            document.getElementById('zoomImg').src = src;
            document.getElementById('zoomModal').classList.remove('hidden');
        }

        function openProduct(name, price, img, sizes) {
            currentProduct = { name, price, img };
            selectedSize = null;
            currentQty = 1;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('modalPrice').innerText = '$' + price.toLocaleString('es-CO');
            document.getElementById('modalImg').src = img;
            document.getElementById('itemQty').innerText = currentQty;
            
            const sCont = document.getElementById('modalSizes');
            sCont.innerHTML = '';
            sizes.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'size-btn w-12 h-12 border-2 rounded-xl text-sm font-bold flex items-center justify-center transition-all';
                btn.innerText = s;
                btn.onclick = () => {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedSize = s;
                };
                sCont.appendChild(btn);
            });
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProduct() { document.getElementById('productModal').classList.add('hidden'); }
        function changeQty(v) { 
            currentQty = Math.max(1, currentQty + v);
            document.getElementById('itemQty').innerText = currentQty;
        }

        function addToCart() {
            if(!selectedSize) return alert('Selecciona una talla');
            cart.push({ ...currentProduct, size: selectedSize, qty: currentQty });
            updateCartUI();
            closeProduct();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const cont = document.getElementById('cartItems');
            cont.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price * item.qty;
                cont.innerHTML += `
                    <div class="flex gap-4 bg-gray-50 p-3 rounded-2xl items-center">
                        <img src="${item.img}" class="w-16 h-16 rounded-xl object-cover">
                        <div class="flex-1">
                            <h4 class="font-bold text-sm">${item.name}</h4>
                            <p class="text-xs text-gray-400">Talla: ${item.size} | Cant: ${item.qty}</p>
                            <p class="text-orange-600 font-black">$${(item.price * item.qty).toLocaleString('es-CO')}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 p-2"><i class="fa-solid fa-trash-can"></i></button>
                    </div>`;
            });
            document.getElementById('cartTotal').innerText = '$' + total.toLocaleString('es-CO');
        }

        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }
        function toggleCart() { document.getElementById('cartModal').classList.toggle('hidden'); }

        function checkout() {
            const name = document.getElementById('cName').value;
            const id = document.getElementById('cId').value;
            const phone = document.getElementById('cPhone').value;
            const addr = document.getElementById('cAddr').value;

            if(cart.length === 0) return alert('El carrito está vacío');
            if(!name || !id || !phone || !addr) return alert('Completa tus datos de envío');

            let itemsText = cart.map(i => `- ${i.qty}x ${i.name} (Talla ${i.size})`).join('\n');
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);

            const text = `🚀 *NUEVO PEDIDO WEB*\n${itemsText}\n\n💰 *Total: $${total.toLocaleString('es-CO')}*\n\n👤 Cliente: ${name}\n🆔 CC: ${id}\n📱 Cel: ${phone}\n📍 Dirección: ${addr}`;
            
            window.open(`https://wa.me/573057778133?text=${encodeURIComponent(text)}`, '_blank');
            window.location.href = "https://checkout.bold.co/payment/LNK_C41NH1MPJA";
        }
    </script>
</body>
</html>

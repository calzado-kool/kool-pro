<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calzado Kool - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }
        .btn-buy { background: linear-gradient(90deg, #ff8c00, #ff4500); color: white; width: 100%; padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; margin-top: 8px; }
        #modal { transition: transform 0.3s ease-out; }
        .size-btn.selected { border-color: #ea580c; background-color: #fff7ed; color: #ea580c; }
        .size-btn.out-of-stock { opacity: 0.3; pointer-events: none; text-decoration: line-through; }
    </style>
</head>
<body class="pb-20">

    <!-- Navbar -->
    <nav class="bg-white px-4 py-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-black italic tracking-tighter uppercase">Calzado <span class="text-orange-600">Kool</span></h1>
        <div class="flex gap-4">
            <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
            <div class="relative">
                <i class="fa-solid fa-cart-shopping text-gray-800"></i>
                <span class="absolute -top-2 -right-2 bg-orange-600 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">1</span>
            </div>
        </div>
    </nav>

    <!-- Promo Banner -->
    <div class="px-4 mt-4">
        <div class="bg-black rounded-2xl p-6 text-white flex justify-between items-center overflow-hidden relative">
            <div>
                <p class="text-xs font-bold uppercase opacity-80">Edición Especial</p>
                <h2 class="text-2xl font-black uppercase leading-tight">Botas <br>Premium</h2>
            </div>
            <i class="fa-solid fa-gem text-5xl opacity-20 absolute -right-2"></i>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid">
        <!-- PRODUCTO REAL: TRACTOR POWER -->
        <div class="card" onclick="openModal('Tractor Power', 160000, 'img/boots_yellow.jpg', ['34', '35', '37', '38', '39', '41', '42'])">
            <div class="relative">
                <img src="img/boots_yellow.jpg" class="h-48 w-full object-cover">
                <div class="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded-lg text-[10px] font-black text-gray-900 shadow-sm">NUEVO</div>
            </div>
            <div class="p-3">
                <p class="text-[10px] font-bold text-orange-600 uppercase tracking-widest">Outdoor Series</p>
                <h4 class="text-sm font-bold text-gray-800 truncate">Tractor Power</h4>
                <p class="text-lg font-black text-gray-900 mt-1">$160.000</p>
                <button class="btn-buy mt-2">Lo quiero</button>
            </div>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-end">
        <div id="modal" class="bg-white w-full rounded-t-3xl p-6 transform translate-y-full transition-transform max-h-[90vh] overflow-y-auto">
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>
            
            <div class="flex gap-4 mb-6">
                <img id="mImg" class="w-24 h-24 rounded-xl object-cover bg-gray-100 shadow-sm">
                <div>
                    <h2 id="mTitle" class="text-xl font-extrabold text-gray-900 leading-tight"></h2>
                    <p id="mPrice" class="text-orange-600 font-black text-lg"></p>
                    <p class="text-[10px] text-green-600 font-bold mt-1 uppercase"><i class="fa-solid fa-check"></i> Disponible para envío inmediato</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest block mb-2">Selecciona tu Talla</label>
                    <div id="mSizes" class="flex gap-2 flex-wrap"></div>
                </div>

                <div class="bg-gray-50 rounded-2xl p-4 space-y-3">
                    <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Datos de Entrega</p>
                    <input type="text" id="cName" placeholder="Nombre completo" class="w-full bg-white rounded-xl px-4 py-3 text-sm border border-gray-100 focus:ring-2 focus:ring-orange-600 outline-none">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="cId" placeholder="Cédula / NIT" class="bg-white rounded-xl px-4 py-3 text-sm border border-gray-100 focus:ring-2 focus:ring-orange-600 outline-none">
                        <input type="text" id="cPhone" placeholder="Celular" class="bg-white rounded-xl px-4 py-3 text-sm border border-gray-100 focus:ring-2 focus:ring-orange-600 outline-none">
                    </div>
                    <input type="text" id="cAddr" placeholder="Dirección, Ciudad y Barrio" class="w-full bg-white rounded-xl px-4 py-3 text-sm border border-gray-100 focus:ring-2 focus:ring-orange-600 outline-none">
                </div>
                
                <button onclick="sendOrder()" class="w-full bg-orange-600 text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-orange-200 mt-4 active:scale-95 transition-all">
                    PAGAR $160.000
                </button>
                <button onclick="closeModal()" class="w-full text-gray-400 text-[10px] font-black py-2 uppercase tracking-widest">Seguir viendo</button>
            </div>
        </div>
    </div>

    <script>
        let product = null;
        let size = null;

        function openModal(name, price, img, sizes) {
            product = { name, price, img };
            document.getElementById('mTitle').innerText = name;
            document.getElementById('mPrice').innerText = '$' + price.toLocaleString('es-CO');
            document.getElementById('mImg').src = img;
            
            const sCont = document.getElementById('mSizes');
            sCont.innerHTML = '';
            sizes.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'size-btn w-12 h-12 border-2 rounded-xl text-sm font-bold transition-all flex items-center justify-center';
                btn.innerText = s;
                btn.onclick = () => {
                    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected', 'border-orange-600', 'bg-orange-50', 'text-orange-600'));
                    btn.classList.add('selected', 'border-orange-600', 'bg-orange-50', 'text-orange-600');
                    size = s;
                };
                sCont.appendChild(btn);
            });

            document.getElementById('modalOverlay').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal').style.transform = 'translateY(0)';
            }, 10);
        }

        function closeModal() {
            document.getElementById('modal').style.transform = 'translateY(100%)';
            setTimeout(() => {
                document.getElementById('modalOverlay').classList.add('hidden');
            }, 300);
        }

        function sendOrder() {
            const name = document.getElementById('cName').value;
            const id = document.getElementById('cId').value;
            const phone = document.getElementById('cPhone').value;
            const addr = document.getElementById('cAddr').value;

            if(!size) return alert('Por favor elige una talla');
            if(!name || !id || !phone || !addr) return alert('Por favor completa todos los datos');

            const text = `🚀 *NUEVO PEDIDO WEB*
👟 *Tractor Power*
📏 Talla: ${size}
👤 Cliente: ${name}
🆔 CC: ${id}
📱 Cel: ${phone}
📍 Dirección: ${addr}
---
✅ *Procediendo al pago seguro...*`;

            const wa = `https://wa.me/573057778133?text=${encodeURIComponent(text)}`;
            const bold = "https://checkout.bold.co/payment/LNK_C41NH1MPJA";

            window.open(wa, '_blank');
            window.location.href = bold;
        }
    </script>
</body>
</html>

    let inventory = JSON.parse(localStorage.getItem('kool_inventory') || JSON.stringify({ p1: 6, p2: 4, p3: 5 }));
    let loadingDone = false;
    
    function saveState() {
      localStorage.setItem('kool_cart', JSON.stringify(cart));
      localStorage.setItem('kool_inventory', JSON.stringify(inventory));
    }

    function available(pid, size){ const p = products.find(x=>x.id===pid); return (p.stockBySize[size]||0) - cart.filter(i=>i.id===pid && i.size===size).length; }
    function render(){
      document.getElementById('grid').innerHTML = products.map(p => {
        return `<article class="card"><button onclick="zoom('${p.img}')" class="w-full block"><img src="${p.img}" alt="${p.name}" class="w-full w-full h-auto object-contain bg-gray-50 p-2"></button><div class="p-4 space-y-3"><div><div class="text-xl font-black uppercase leading-tight">${p.name}</div><div class="text-gray-500 text-sm">${p.color} · ${p.material}</div></div><div class="text-sm font-black text-emerald-600 font-black bg-emerald-50 px-2 py-0.5 rounded-full inline-block">Stock por talla</div><div class="grid grid-cols-6 gap-2">${[35,36,37,38,39,40].map(s => { const q = available(p.id,s); return `<button class="size ${selected[p.id]===s ? 'active':''}" onclick="choose('${p.id}',${s})" ${q<=0 ? 'disabled' : ''}>${s}<div class="text-[10px] font-bold ${q<=0 ? 'text-red-500':'text-emerald-600 font-black bg-emerald-50 px-2 py-0.5 rounded-full inline-block'}">${q<=0 ? '0' : q}</div></button>`; }).join('')}</div><div class="flex items-center justify-between pt-1"><div class="flex flex-col"><span class="text-xs text-gray-400 line-through font-bold">$${p.price_old.toLocaleString('es-CO')}</span><span class="text-2xl font-black text-red-700 font-black">$${p.price.toLocaleString('es-CO')}</span></div><button onclick="add('${p.id}')" class="btn">Agregar</button></div></div></article>`;
      }).join('');
      updateCart();
      loadingDone = true;
      const gate = document.getElementById('loadingGate');
      if (gate) gate.innerHTML = 'Productos cargados. El módulo de venta ya está activo.';
    }
    function choose(pid, size){ selected[pid]=size; render(); }
    function zoom(src){ document.getElementById('zoomImg').src=src; document.getElementById('zoom').classList.remove('hidden'); document.getElementById('zoom').classList.add('flex'); }
    function closeZoom(){ document.getElementById('zoom').classList.add('hidden'); document.getElementById('zoom').classList.remove('flex'); }
    function add(pid){ if (!loadingDone) return alert('Espera a que terminen de cargar todos los productos'); const size = selected[pid] || 35; if (available(pid,size) <= 0) return alert('No hay stock en esa talla'); const p = products.find(x=>x.id===pid); cart.push({ ...p, size }); inventory[p.id] = (inventory[p.id]||0) - 1; if(typeof saveState === 'function') saveState(); updateCart(); render(); }
    function remove(i){ const item = cart[i]; if(item) inventory[item.id] = (inventory[item.id]||0)+1; cart.splice(i,1); saveState(); updateCart(); render(); }
    function updateCart(){ document.getElementById('count').innerText = cart.length; document.getElementById('total').innerText = '$' + cart.reduce((a,b)=>a+b.price,0).toLocaleString('es-CO'); document.getElementById('items').innerHTML = cart.length ? cart.map((i,idx)=>`<div class="flex gap-3 border-b pb-4"><img src="${i.img}" class="w-16 h-16 object-cover rounded-lg"><div class="flex-1"><div class="font-black uppercase text-xs">${i.name}</div><div class="text-xs text-gray-500">Talla: ${i.size}</div><div class="text-xs text-emerald-600 font-black bg-emerald-50 px-2 py-0.5 rounded-full inline-block font-bold">Quedan en esa talla: ${available(i.id, i.size)}</div><div class="font-black">$${i.price.toLocaleString('es-CO')}</div></div><button onclick="remove(${idx})" class="text-gray-400 text-xl">×</button></div>`).join('') : '<div class="text-gray-400 py-10 text-center">Carrito vacío</div>' }
    function toggleCart(open){ 
      const d = document.getElementById('drawer'); 
      const o = document.getElementById('ov'); 
      if(open){
        d.classList.add('open');
        o.classList.add('on');
        document.body.classList.add('cart-open');
      } else {
        d.classList.remove('open');
        o.classList.remove('on');
        document.body.classList.remove('cart-open');
      } 
    }
    async function checkout(){ if(!loadingDone) return alert('Espera a que carguen todos los productos'); if(!cart.length) return alert('Agrega productos primero'); const name=document.getElementById('name').value.trim(); const phone=document.getElementById('phone').value.trim(); const addr=document.getElementById('addr').value.trim(); if(!name || !phone || !addr) return alert('Completa nombre, WhatsApp y dirección'); const btn=document.getElementById('payBtn'); btn.disabled=true; btn.innerText='PROCESANDO...'; try { const total = cart.reduce((a,b)=>a+b.price,0); const desc = cart.map(i=>`${i.name} (T:${i.size})`).join(', '); const res = await fetch('https://bold-bridge-7qge.vercel.app/api/checkout', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ amount: total, label:'KOOL PRO', description: desc + ' | ' + addr }) }); const data = await res.json(); if(data.url) location.href = data.url; else throw new Error('No URL'); } catch(e){ alert('No se pudo iniciar el pago'); btn.disabled=false; btn.innerText='Finalizar compra'; } }
    render();
  </script>

  <div id="floatingAction" style="display: none;" class="fixed bottom-6 right-6 z-[40] flex flex-col items-end gap-2 pointer-events-none">
    <div class="bg-black text-white px-3 py-1.5 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-xl animate-bounce pointer-events-auto">
      ¡Cierra tu pedido aquí!
    </div>
    <button onclick="toggleCart(true)" class="group pointer-events-auto flex items-center gap-2 bg-black text-white px-3 py-2 rounded-full shadow-[0_14px_30px_rgba(0,0,0,0.22)] hover:scale-105 transition-transform active:scale-95">
      <span class="text-[11px] font-black uppercase tracking-widest">Terminar pedido</span>
      <div class="bg-white text-black w-9 h-9 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
      </div>
    </button>
  </div>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/kool-pro/sw.js').catch(()=>{}));}</script>
</body>
</html>

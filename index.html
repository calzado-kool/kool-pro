<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALZADO KOOL | Tienda Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; color: #1a1a1a; }
    .kool-card { background: white; border: 1px solid #eee; border-radius: 24px; transition: all 0.3s; }
    .kool-card:hover { transform: translateY(-5px); border-color: #f97316; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
    .grad { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
    .size-btn { border: 2px solid #f0f0f0; border-radius: 12px; transition: all 0.2s; cursor: pointer; }
    .size-btn.active { border-color: #ea580c; background: #fff7ed; color: #ea580c; font-weight: 800; }
    .size-btn.disabled { opacity: 0.3; cursor: not-allowed; background: #fafafa; }
    .btn-main { background: #1a1a1a; color: white; border-radius: 14px; transition: all 0.2s; }
    .btn-main:hover { background: #ea580c; transform: scale(1.02); }
    .sidebar { position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 400px; background: white; z-index: 1000; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.05); }
    .sidebar.open { transform: translateX(0); }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 999; display: none; }
    .overlay.open { display: block; }
    .input-kool { width: 100%; padding: 12px 16px; border: 1.5px solid #eee; border-radius: 12px; outline: none; transition: 0.2s; }
    .input-kool:focus { border-color: #ea580c; box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.1); }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 grad rounded-xl flex items-center justify-center text-white shadow-lg"><i class="fa-solid fa-shoe-prints"></i></div>
        <span class="text-xl font-black tracking-tight">KOOL</span>
      </div>
      <button onclick="toggleCart(true)" class="relative p-2 text-gray-700 hover:text-orange-600 transition-colors">
        <i class="fa-solid fa-bag-shopping text-2xl"></i>
        <span id="badge" class="absolute -top-1 -right-1 w-5 h-5 grad text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">0</span>
      </button>
    </div>
  </nav>

  <!-- CATÁLOGO -->
  <main class="max-w-7xl mx-auto px-6 py-12">
    <div class="mb-12">
      <h1 class="text-4xl font-black mb-3">Colección Premium</h1>
      <p class="text-gray-500 max-w-lg">Calzado de alta gama con stock sincronizado por IA. Selecciona tu talla y agrégalo al carrito.</p>
    </div>

    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
      <!-- Los productos se cargan aquí -->
    </div>
  </main>

  <!-- CARRITO SIDEBAR -->
  <div id="overlay" class="overlay" onclick="toggleCart(false)"></div>
  <div id="cart" class="sidebar flex flex-col">
    <div class="p-6 border-b flex justify-between items-center">
      <h2 class="text-xl font-black">Tu Carrito</h2>
      <button onclick="toggleCart(false)" class="text-gray-400 hover:text-black"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    
    <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-4">
      <!-- Items del carrito -->
    </div>

    <div id="form-section" class="p-6 border-t bg-gray-50/50 space-y-4">
      <div id="client-form" class="space-y-3">
        <h3 class="font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-truck-fast text-orange-500"></i> Datos de entrega</h3>
        <input type="text" id="name" placeholder="Nombre completo" class="input-kool">
        <input type="tel" id="phone" placeholder="WhatsApp" class="input-kool">
        <textarea id="addr" placeholder="Dirección completa (Ciudad, Barrio)" class="input-kool h-20 resize-none"></textarea>
      </div>

      <div class="flex justify-between items-center text-xl font-black pt-2">
        <span>Total</span>
        <span id="total" class="text-orange-600">$0</span>
      </div>

      <button id="btn-pay" onclick="checkout()" class="w-full py-4 grad text-white font-bold rounded-2xl shadow-lg shadow-orange-200 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
        <span>FINALIZAR COMPRA</span> <i class="fa-solid fa-shield-check"></i>
      </button>
    </div>
  </div>

  <script>
    const App = {
      products: [
        { id:'p1', name:'Bota Urbana Roja', price:160000, img:'img/bota_roja.jpg', desc:'Bota táctica de alto rendimiento, resistente y ligera.', stock:{'34':1,'35':2,'36':2,'37':2,'38':3,'39':1}, skus:{'34':'020','35':'021','36':'022','37':'023','38':'024','39':'025'} },
        { id:'p2', name:'Tractor Power', price:160000, img:'img/tractor_power.jpg', desc:'Resistencia máxima para trabajo pesado y montaña.', stock:{'34':2,'36':1,'37':4,'38':2,'39':5,'40':2}, skus:{'34':'TR34','36':'TR36','37':'TR37','38':'TR38','39':'TR39','40':'TR40'} },
        { id:'p3', name:'Tenis Premium Edition', price:145000, img:'img/tenis_premium.jpg', desc:'Elegancia y confort en cada paso. Diseño exclusivo.', stock:{'35':3,'36':5,'37':2,'38':4,'39':1}, skus:{'35':'TP35','36':'TP36','37':'TP37','38':'TP38','39':'TP39'} },
        { id:'p4', name:'Sneakers Urban', price:145000, img:'img/sneakers_urban.jpg', desc:'Estilo versátil para el día a día en la ciudad.', stock:{'34':2,'35':1,'36':3,'37':2,'38':4,'39':2}, skus:{'34':'SU34','35':'SU35','36':'SU36','37':'SU37','38':'SU38','39':'SU39'} }
      ],
      cart: JSON.parse(localStorage.getItem('kool_cart_final') || '[]'),
      sel: {},

      init() {
        this.renderCatalog();
        this.renderCart();
      },

      fmt(v) { return '$' + Number(v).toLocaleString('es-CO'); },

      renderCatalog() {
        const container = document.getElementById('grid');
        container.innerHTML = this.products.map(p => `
          <div class="kool-card overflow-hidden flex flex-col lg:flex-row h-full">
            <div class="lg:w-2/5 aspect-square bg-gray-50 overflow-hidden relative group">
              <img src="${p.img}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
              <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase text-gray-800 shadow-sm border border-gray-100">KOOL IA</div>
            </div>
            <div class="lg:w-3/5 p-8 flex flex-col justify-between space-y-6">
              <div>
                <h2 class="text-2xl font-black text-gray-900">${p.name}</h2>
                <p class="text-orange-600 font-extrabold text-2xl mt-1">${this.fmt(p.price)}</p>
                <p class="text-gray-400 text-sm mt-3 leading-relaxed">${p.desc}</p>
              </div>
              
              <div class="space-y-4">
                <div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-widest text-gray-400">
                  <span>Seleccionar Talla</span>
                  <span>Stock Real</span>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  ${Object.entries(p.stock).map(([s, q]) => {
                    const ok = q > 0;
                    return `
                      <button onclick="${ok ? `App.select('${p.id}', '${s}')` : ''}" 
                              id="btn-${p.id}-${s}" 
                              class="size-btn p-3 flex flex-col items-center ${!ok ? 'disabled' : ''}">
                        <span class="text-lg font-bold">${s}</span>
                        <span class="text-[9px] font-black ${q < 3 ? 'text-red-500' : 'text-gray-300'}">${ok ? q + ' UDS' : 'FIN'}</span>
                      </button>`;
                  }).join('')}
                </div>
              </div>

              <button onclick="App.add('${p.id}')" class="btn-main w-full py-4 font-black text-sm shadow-xl flex items-center justify-center gap-2">
                <i class="fa-solid fa-cart-plus"></i> AGREGAR AL CARRITO
              </button>
            </div>
          </div>
        `).join('');
      },

      select(pid, s) {
        this.sel[pid] = s;
        document.querySelectorAll(`[id^="btn-${pid}-"]`).forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${pid}-${s}`).classList.add('active');
      },

      add(pid) {
        const s = this.sel[pid];
        if(!s) return alert('Por favor selecciona una talla');
        const p = this.products.find(x => x.id === pid);
        const item = this.cart.find(i => i.id === pid && i.size === s);
        
        if(item) {
          if(item.qty >= p.stock[s]) return alert('No hay más unidades disponibles de esta talla');
          item.qty++;
        } else {
          this.cart.push({ id:p.id, name:p.name, price:p.price, size:s, sku:p.skus[s], img:p.img, qty:1 });
        }
        this.save();
        toggleCart(true);
      },

      save() {
        localStorage.setItem('kool_cart_final', JSON.stringify(this.cart));
        this.renderCart();
      },

      renderCart() {
        const list = document.getElementById('cart-items');
        const count = this.cart.reduce((s,i) => s + i.qty, 0);
        const total = this.cart.reduce((s,i) => s + (i.price * i.qty), 0);
        
        document.getElementById('badge').textContent = count;
        document.getElementById('total').textContent = this.fmt(total);

        if(!this.cart.length) {
          list.innerHTML = `<div class="text-center py-20 text-gray-300"><i class="fa-solid fa-cart-shopping text-6xl mb-4 opacity-20"></i><p class="font-bold">Tu carrito está vacío</p></div>`;
          document.getElementById('client-form').classList.add('hidden');
          return;
        }

        document.getElementById('client-form').classList.remove('hidden');
        list.innerHTML = this.cart.map((i, idx) => `
          <div class="flex gap-4 p-4 border rounded-2xl">
            <img src="${i.img}" class="w-16 h-16 rounded-xl object-cover">
            <div class="flex-grow">
              <div class="flex justify-between items-start">
                <h4 class="font-bold text-sm text-gray-800">${i.name}</h4>
                <button onclick="App.remove(${idx})" class="text-gray-300 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
              </div>
              <div class="text-[10px] font-black text-orange-600 uppercase mt-1">Talla ${i.size} | SKU ${i.sku}</div>
              <div class="flex justify-between items-center mt-3">
                <div class="flex items-center gap-3 bg-gray-100 rounded-full px-3 py-1 font-bold text-xs">
                  <button onclick="App.qty(${idx},-1)"><i class="fa-solid fa-minus"></i></button>
                  <span>${i.qty}</span>
                  <button onclick="App.qty(${idx},1)"><i class="fa-solid fa-plus"></i></button>
                </div>
                <span class="font-black text-sm">${this.fmt(i.price * i.qty)}</span>
              </div>
            </div>
          </div>
        `).join('');
      },

      qty(idx, d) {
        const i = this.cart[idx];
        const p = this.products.find(x => x.id === i.id);
        if(d > 0 && i.qty >= p.stock[i.size]) return alert('Límite de stock alcanzado');
        i.qty += d;
        if(i.qty <= 0) this.cart.splice(idx, 1);
        this.save();
      },

      remove(idx) { this.cart.splice(idx, 1); this.save(); },

      async checkout() {
        const n = document.getElementById('name').value.trim();
        const p = document.getElementById('phone').value.trim();
        const a = document.getElementById('addr').value.trim();
        if(!n || !p || !a) return alert('Por favor llena todos los datos de envío');

        const btn = document.getElementById('btn-pay');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERANDO PAGO SEGURO...';

        const oid = 'KOOL-' + Date.now();
        const total = this.cart.reduce((s,i) => s + (i.price * i.qty), 0);
        const desc = this.cart.map(i => `[ORD:${oid} | SKU:${i.sku} | SZ:${i.size} | NAME:${i.name} | QTY:${i.qty}]`).join(' ');

        try {
          const res = await fetch('https://bold-bridge-7qge-6pdxknayx-lhvlhv13-1274s-projects.vercel.app/api/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ amount: total, label: 'PEDIDO KOOL '+oid, description: desc + ' | ENVIO: ' + a, order_id: oid })
          });
          const data = await res.json();
          if(data.url) {
            const itemsList = this.cart.map(i => `✅ ${i.qty}x ${i.name} (T${i.size})`).join('%0A');
            const wa = `👟 *NUEVO PEDIDO KOOL*%0A%0A🆔 *Orden:* ${oid}%0A%0A📦 *Productos:*%0A${itemsList}%0A%0A💰 *Total:* ${this.fmt(total)}%0A👤 *Cliente:* ${n}%0A📱 *WhatsApp:* ${p}%0A📍 *Envío:* ${a}`;
            window.open(`https://wa.me/573057778133?text=${wa}`, '_blank');
            setTimeout(() => window.location.href = data.url, 800);
          } else throw 'err';
        } catch(e) {
          alert('Error de conexión con la pasarela');
          btn.disabled = false;
          btn.innerHTML = orig;
        }
      }
    };

    function toggleCart(open) {
      document.getElementById('cart').classList.toggle('open', open);
      document.getElementById('overlay').classList.toggle('open', open);
    }

    App.init();
  </script>
</body>
</html>

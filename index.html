<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calzado Kool | Tienda Profesional</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--kool:#ea580c;--kool2:#f97316}
    body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;color:#0f172a; scroll-behavior: smooth;}
    .glass{backdrop-filter: blur(18px); background: rgba(255,255,255,.78)}
    .shadow-soft{box-shadow:0 20px 40px rgba(2,6,23,.08)}
    .btn-kool{background:linear-gradient(135deg,var(--kool2),var(--kool));color:white; transition: all .2s;}
    .btn-kool:hover{transform:scale(1.02); shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.4);}
    .size-card{cursor:pointer; border:2px solid #e2e8f0; border-radius:1rem; padding:1rem; transition: .2s;}
    .size-card.active{border-color:var(--kool); background:rgba(234,88,12,0.05); ring: 3px solid rgba(234,88,12,0.1)}
    .size-card.disabled{opacity:0.3; cursor:not-allowed; background:#f1f5f9}
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/90 glass">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white"><i class="fa-solid fa-shoe-prints"></i></div>
        <h1 class="text-2xl font-black tracking-tighter">CALZADO KOOL</h1>
      </div>
      <button onclick="toggleCart(true)" class="relative p-3 bg-white border rounded-2xl shadow-sm hover:bg-orange-50 transition-colors group">
        <i class="fa-solid fa-bag-shopping text-slate-700 group-hover:text-orange-600"></i>
        <span id="cartCount" class="absolute -top-1 -right-1 w-5 h-5 bg-orange-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">0</span>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-4 py-10 space-y-12">
    
    <!-- CATALOG -->
    <section>
      <div class="mb-8">
        <h2 class="text-3xl font-black text-slate-800">Catálogo Premium</h2>
        <p class="text-slate-500">Selecciona el producto para ver detalles y agregar múltiples tallas.</p>
      </div>
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Products -->
      </div>
    </section>

  </main>

  <!-- PRODUCT MODAL -->
  <div id="modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
    <div class="relative bg-white w-full max-w-5xl rounded-[2.5rem] shadow-2xl overflow-hidden max-h-[90vh] flex flex-col md:flex-row">
      <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-10 h-10 bg-white/80 backdrop-blur rounded-full flex items-center justify-center hover:text-orange-600 transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
      
      <!-- IMAGE SECTION -->
      <div class="w-full md:w-1/2 bg-slate-100 overflow-hidden relative group">
        <img id="mImg" src="" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-125 cursor-zoom-in" alt="Zoom" onclick="window.open(this.src)">
      </div>

      <!-- DETAILS SECTION -->
      <div class="w-full md:w-1/2 p-6 md:p-10 overflow-y-auto flex flex-col space-y-6">
        <div>
          <span id="mCat" class="text-orange-600 font-bold text-xs uppercase tracking-widest">Premium</span>
          <h3 id="mTitle" class="text-4xl font-black text-slate-900 mt-2">Nombre</h3>
          <p id="mPrice" class="text-3xl font-extrabold text-slate-800 mt-2">$0</p>
        </div>

        <div class="space-y-4">
          <h4 class="font-bold text-slate-700 flex justify-between items-center">
            <span>Selecciona tu talla</span>
            <span class="text-xs text-slate-400 font-normal uppercase tracking-widest">Stock real</span>
          </h4>
          <div id="mSizes" class="grid grid-cols-3 sm:grid-cols-4 gap-3">
            <!-- Sizes cards -->
          </div>
        </div>

        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 space-y-2">
           <h4 class="font-bold text-slate-700 text-sm">Descripción del producto</h4>
           <p id="mDesc" class="text-sm text-slate-500 leading-relaxed"></p>
        </div>

        <button onclick="addToCart()" class="btn-kool w-full py-5 rounded-2xl font-black text-lg shadow-xl flex items-center justify-center gap-3">
          <i class="fa-solid fa-cart-plus"></i> AGREGAR AL CARRITO
        </button>
        
        <p class="text-[10px] text-center text-slate-400 uppercase tracking-tighter">Sincronizado automáticamente con inventario IA</p>
      </div>
    </div>
  </div>

  <!-- CART SIDEBAR -->
  <aside id="cartSidebar" class="fixed inset-0 z-[100] hidden">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="toggleCart(false)"></div>
    <div id="cartPanel" class="absolute top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col transition-transform duration-300 translate-x-full">
      <div class="p-6 border-b flex items-center justify-between">
        <h3 class="text-2xl font-black tracking-tight">Tu Carrito</h3>
        <button onclick="toggleCart(false)" class="p-2 hover:bg-slate-100 rounded-full transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div id="cartItems" class="flex-grow p-6 overflow-y-auto space-y-4">
        <!-- Cart lines -->
      </div>

      <div class="p-6 border-t bg-slate-50/80 space-y-6">
        <div id="checkoutForm" class="space-y-4">
          <h4 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-truck-ramp-box text-orange-600"></i> Datos de entrega</h4>
          <input type="text" id="cName" placeholder="Nombre completo" class="w-full p-4 border rounded-2xl outline-none focus:border-orange-500 transition-all">
          <input type="tel" id="cPhone" placeholder="WhatsApp" class="w-full p-4 border rounded-2xl outline-none focus:border-orange-500 transition-all">
          <textarea id="cAddr" placeholder="Dirección completa (Ciudad, Barrio, etc.)" class="w-full p-4 border rounded-2xl outline-none focus:border-orange-500 transition-all h-20 resize-none"></textarea>
        </div>

        <div class="flex justify-between items-center text-2xl font-black">
          <span>Total</span>
          <span id="cartTotal" class="text-orange-600">$0</span>
        </div>

        <button onclick="processPayment()" id="btnPay" class="btn-kool w-full py-5 rounded-2xl font-black text-lg shadow-xl flex items-center justify-center gap-3">
          <span>FINALIZAR Y PAGAR</span> <i class="fa-solid fa-shield-check"></i>
        </button>
      </div>
    </div>
  </aside>

  <script>
    const products = [
      { id: 'p1', name: 'Bota Urbana Roja', category: 'Táctico Urbano', price: 160000, images: ['img/bota_roja.jpg','img/bota_roja_2.jpg'], description: 'Bota diseñada para la máxima durabilidad y estilo. Suela antideslizante y materiales premium resistentes al agua.', stock: {'34':1,'35':2,'36':2,'37':2,'38':3,'39':1}, skus: {'34':'020','35':'021','36':'022','37':'023','38':'024','39':'025'}, color: 'Rojo' },
      { id: 'p2', name: 'Tractor Power', category: 'Resistente', price: 160000, images: ['img/tractor_power.jpg'], description: 'La bota más fuerte para el trabajo pesado o el outdoor. Construcción reforzada y confort superior.', stock: {'34':2,'36':1,'37':4,'38':2,'39':5,'40':2}, skus: {'34':'TR-34','36':'TR-36','37':'TR-37','38':'TR-38','39':'TR-39','40':'TR-40'}, color: 'Camel' },
      { id: 'p3', name: 'Tenis Premium Edition', category: 'Lifestyle', price: 145000, images: ['img/tenis_premium.jpg'], description: 'Diseño exclusivo con acabados hechos a mano. La combinación perfecta entre elegancia y comodidad deportiva.', stock: {'35':3,'36':5,'37':2,'38':4,'39':1}, skus: {'35':'TP-35','36':'TP-36','37':'TP-37','38':'TP-38','39':'TP-39'}, color: 'Blanco/Negro' },
      { id: 'p4', name: 'Sneakers Urban Premium', category: 'Urban', price: 145000, images: ['img/sneakers_urban.jpg'], description: 'Caminatas largas o salidas casuales, estos sneakers son tu mejor aliado. Versatilidad total.', stock: {'34':2,'35':1,'36':3,'37':2,'38':4,'39':2}, skus: {'34':'SU-34','35':'SU-35','36':'SU-36','37':'SU-37','38':'SU-38','39':'SU-39'}, color: 'Negro' }
    ];

    let cart = [];
    let curProd = null;
    let selSize = null;

    const fmt = v => '$' + Number(v).toLocaleString('es-CO');

    function renderCatalog() {
      document.getElementById('productGrid').innerHTML = products.map(p => `
        <div onclick="openModal('${p.id}')" class="bg-white border rounded-[2rem] overflow-hidden cursor-pointer hover:shadow-xl transition-all group">
          <div class="aspect-square bg-slate-50 relative overflow-hidden">
            <img src="${p.images[0]}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
            <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase text-slate-800">${p.category}</div>
          </div>
          <div class="p-6">
            <h4 class="font-extrabold text-lg text-slate-800 group-hover:text-orange-600">${p.name}</h4>
            <p class="text-orange-600 font-black text-xl mt-1">${fmt(p.price)}</p>
            <div class="mt-4 flex flex-wrap gap-1">
              ${Object.keys(p.stock).map(s => `<span class="text-[9px] font-bold border rounded-md px-1.5 py-0.5 ${p.stock[s]>0?'text-slate-400':'text-red-300 line-through'}">T${s}</span>`).join('')}
            </div>
          </div>
        </div>
      `).join('');
    }

    function openModal(id) {
      curProd = products.find(x => x.id === id);
      selSize = null;
      document.getElementById('mTitle').textContent = curProd.name;
      document.getElementById('mPrice').textContent = fmt(curProd.price);
      document.getElementById('mDesc').textContent = curProd.description;
      document.getElementById('mCat').textContent = curProd.category;
      document.getElementById('mImg').src = curProd.images[0];
      
      const sizesDiv = document.getElementById('mSizes');
      sizesDiv.innerHTML = Object.entries(curProd.stock).map(([s, q]) => {
        const ok = q > 0;
        return `<div onclick="${ok ? `selectSize('${s}')` : ''}" class="size-card ${!ok ? 'disabled' : ''} ${selSize === s ? 'active' : ''}" data-size="${s}">
          <div class="text-xl font-black text-center">${s}</div>
          <div class="text-[10px] text-center font-bold uppercase mt-1 ${q < 3 ? 'text-red-500' : 'text-slate-400'}">${ok ? q + ' Disp.' : 'Agotado'}</div>
        </div>`;
      }).join('');

      document.getElementById('modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function selectSize(s) {
      selSize = s;
      document.querySelectorAll('.size-card').forEach(el => {
        el.classList.toggle('active', el.dataset.size === s);
      });
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function addToCart() {
      if (!selSize) return alert('Selecciona una talla primero');
      const key = `${curProd.id}-${selSize}`;
      const item = cart.find(i => `${i.id}-${i.size}` === key);
      if (item) item.qty++;
      else cart.push({ ...curProd, size: selSize, sku: curProd.skus[selSize], qty: 1 });
      
      renderCart();
      closeModal();
      toggleCart(true);
    }

    function toggleCart(open) {
      const sidebar = document.getElementById('cartSidebar');
      const panel = document.getElementById('cartPanel');
      if (open) {
        sidebar.classList.remove('hidden');
        setTimeout(() => panel.classList.remove('translate-x-full'), 10);
      } else {
        panel.classList.add('translate-x-full');
        setTimeout(() => sidebar.classList.add('hidden'), 300);
      }
    }

    function renderCart() {
      const list = document.getElementById('cartItems');
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const count = cart.reduce((s, i) => s + i.qty, 0);
      
      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = fmt(total);

      if (cart.length === 0) {
        list.innerHTML = `<div class="text-center py-20 text-slate-300"><i class="fa-solid fa-cart-plus text-6xl mb-4"></i><p class="font-bold">Carrito vacío</p></div>`;
        document.getElementById('checkoutForm').classList.add('hidden');
        return;
      }

      document.getElementById('checkoutForm').classList.remove('hidden');
      list.innerHTML = cart.map((i, idx) => `
        <div class="flex gap-4 bg-white p-4 border rounded-3xl shadow-sm">
          <img src="${i.images[0]}" class="w-16 h-16 rounded-2xl object-cover">
          <div class="flex-grow">
            <div class="flex justify-between items-start">
              <h5 class="font-bold text-slate-800 text-sm">${i.name}</h5>
              <button onclick="remove(${idx})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can text-xs"></i></button>
            </div>
            <div class="flex items-center gap-2 mt-1">
              <span class="bg-orange-50 text-orange-600 text-[10px] font-black px-2 py-0.5 rounded">Talla ${i.size}</span>
            </div>
            <div class="flex justify-between items-center mt-2">
              <div class="flex items-center gap-3 bg-slate-100 rounded-full px-3 py-1 font-bold text-xs">
                <button onclick="qty(${idx},-1)"><i class="fa-solid fa-minus"></i></button>
                <span>${i.qty}</span>
                <button onclick="qty(${idx},1)"><i class="fa-solid fa-plus"></i></button>
              </div>
              <span class="font-black text-orange-600">${fmt(i.price * i.qty)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function qty(idx, d) { cart[idx].qty += d; if (cart[idx].qty <= 0) cart.splice(idx, 1); renderCart(); }
    function remove(idx) { cart.splice(idx, 1); renderCart(); }

    async function processPayment() {
      const n = document.getElementById('cName').value.trim();
      const p = document.getElementById('cPhone').value.trim();
      const a = document.getElementById('cAddr').value.trim();
      if (!n || !p || !a) return alert('Completa todos los datos de entrega');

      const btn = document.getElementById('btnPay');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> GENERANDO PAGO...`;

      const orderId = 'KOOL-' + Date.now();
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const desc = cart.map(i => `[ORD:${orderId} | SKU:${i.sku} | SZ:${i.size} | NAME:${i.name} | CLR:${i.color}]`).join(' ');

      try {
        const res = await fetch('https://bold-bridge-7qge-6pdxknayx-lhvlhv13-1274s-projects.vercel.app/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: total, label: 'CALZADO KOOL #' + orderId.split('-')[1], description: desc + ' | ENVIO: ' + a, order_id: orderId })
        });
        const data = await res.json();
        if (data.url) {
          const wa = `🚀 *NUEVO PEDIDO WEB (CALZADO KOOL)*%0A%0A${cart.map(i=>`• ${i.qty}x ${i.name} (Talla ${i.size})`).join('%0A')}%0A%0A💰 *Total:* ${fmt(total)}%0A%0A👤 *Cliente:* ${n}%0A📱 *Cel:* ${p}%0A📍 *Envío:* ${a}%0A🆔 *Orden:* ${orderId}`;
          window.open(`https://wa.me/573057778133?text=${wa}`, '_blank');
          setTimeout(() => window.location.href = data.url, 800);
        } else throw 'Error';
      } catch (e) {
        alert('Error al conectar con Bold');
        btn.disabled = false;
        btn.innerHTML = 'REINTENTAR PAGO';
      }
    }

    renderCatalog();
    renderCart();
  </script>
</body>
</html>

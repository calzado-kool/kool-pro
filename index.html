<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOOL PRO v1781280465</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body{font-family:Inter,system-ui,sans-serif;background:#fff;color:#111;margin:0;padding:0}
    .card{border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;background:#fff;transition:transform 0.3s ease;display:flex;flex-direction:column;height:100%}
    .card:hover{transform:translateY(-5px)}
    .btn{background:#111;color:#fff;font-weight:900;text-transform:uppercase;padding:.9rem 1rem;border-radius:12px;cursor:pointer;border:none}
    .btn:disabled{background:#ccc;cursor:not-allowed}
    .size{border:1px solid #d1d5db;border-radius:10px;padding:.55rem;text-align:center;font-weight:800;background:none;cursor:pointer;position:relative}
    .size.active{background:#111;color:#fff;border-color:#111}
    .drawer{position:fixed;inset:0 0 0 auto;width:420px;max-width:100vw;background:#fff;box-shadow:-20px 0 40px rgba(0,0,0,.15);transform:translateX(100%);transition:.25s;z-index:60;display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:50}
    .overlay.on{display:block}
    #zoom{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
    .fab-cart{position:fixed;bottom:30px;right:30px;width:70px;height:70px;background:#111;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.3);cursor:pointer;z-index:40}
    .badge{position:absolute;top:-5px;right:-5px;background:#ff4b2b;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;border:3px solid #fff}
  </style>
</head>
<body>

  <div class="p-6 border-b flex items-center justify-between sticky top-0 bg-white z-30">
    <div class="flex flex-col">
      <div class="text-2xl font-black tracking-tighter">KOOL PRO</div>
      <div class="text-xs uppercase tracking-widest font-bold text-orange-500">Premium Footwear IA</div>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 pb-40">
    <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 mb-8 text-sm text-gray-500 font-medium mt-6">
      Selecciona tu talla y agrega al carrito. Paga seguro con Bold.
    </div>
    <div id="grid" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <div id="cartBtn" class="fab-cart" onclick="toggleCart(true)">
    <i class="fa-solid fa-bag-shopping text-2xl"></i>
    <div id="count" class="badge">0</div>
  </div>

  <div id="zoom" onclick="closeZoom()">
    <img id="zoomImg" src="" class="max-w-full max-h-full object-contain rounded-lg">
  </div>

  <div id="ov" class="overlay" onclick="toggleCart(false)"></div>
  <aside id="drawer" class="drawer">
    <div class="p-6 border-b flex items-center justify-between">
      <div class="text-xl font-black uppercase">Tu Carrito</div>
      <button onclick="toggleCart(false)" class="text-2xl">&times;</button>
    </div>
    <div id="items" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
    <div class="p-6 border-t bg-gray-50 space-y-4">
      <div class="flex items-center justify-between text-lg font-black">
        <span>TOTAL</span>
        <span id="total">$0</span>
      </div>
      <div class="space-y-3">
        <input type="text" id="name" placeholder="Nombre completo" class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-black outline-none">
        <input type="tel" id="phone" placeholder="WhatsApp" class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-black outline-none">
        <input type="text" id="addr" placeholder="Dirección de envío" class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:ring-2 focus:ring-black outline-none">
      </div>
      <button id="payBtn" onclick="checkoutBridge()" class="btn w-full py-4 text-sm">Finalizar compra</button>
      <p class="text-center text-[10px] text-gray-400 font-bold uppercase tracking-widest">Pago seguro procesado por Bold</p>
    </div>
  </aside>

  <script>
    const products = [{"id": "kool-natalia-1781280465", "name": "Natalia", "price": 2000, "price_old": 185000, "img": "media/natalia_final_1781280465.jpg", "color": "Botín cuero negro", "stockBySize": {"35": 10, "36": 8, "37": 9, "39": 3, "40": 1}}];
    let cart = [];
    let selected = {};
    let boldPaymentUrl = null;

    function render() {
      const grid = document.getElementById('grid');
      if (!grid) return;
      grid.innerHTML = products.map(p => {
        const priceOld = p.price_old || Math.round(p.price * 1.2);
        const sizes = Object.keys(p.stockBySize).map(Number).sort((a,b)=>a-b).map(s => {
          const q = available(p.id, s);
          const isActive = Number(selected[p.id]) === s;
          return `<button class="size ${isActive ? 'active' : ''}" onclick="choose('${p.id}', ${s})" ${q <= 0 ? 'disabled' : ''}>
            ${s}
            <div class="text-[9px] font-black ${q <= 0 ? 'text-red-400' : 'text-emerald-500'}">${q <= 0 ? '0' : q}</div>
          </button>`;
        }).join('');

        return `
          <article class="card relative group" id="product-${p.id}">
            <button onclick="zoom('${p.img}')" class="w-full aspect-square overflow-hidden bg-gray-50 relative">
              <img src="${p.img}" alt="${p.name}" class="w-full h-full object-contain p-4 group-hover:scale-110 transition-transform duration-500" >
            </button>
            <div class="p-6 space-y-4 flex-1 flex flex-col">
              <div>
                <div class="text-xs font-black text-gray-400 uppercase tracking-widest mb-1">${p.color}</div>
                <div class="text-xl font-black uppercase leading-tight">${p.name}</div>
              </div>
              <div class="space-y-2">
                <div class="text-[10px] font-black uppercase tracking-wider text-emerald-600">Stock disponible</div>
                <div class="grid grid-cols-5 gap-2">${sizes}</div>
              </div>
              <div class="flex items-center justify-between pt-2 mt-auto">
                <div class="flex flex-col">
                  <span class="text-[10px] text-gray-400 line-through font-bold">$${priceOld.toLocaleString('es-CO')}</span>
                  <span class="text-xl font-black text-black">$${p.price.toLocaleString('es-CO')}</span>
                </div>
                <div class="flex gap-2">
                  <button onclick="shareProduct('${p.id}', '${p.name}')" class="w-11 h-11 flex items-center justify-center border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors text-gray-400">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                  </button>
                  <button onclick="add('${p.id}')" id="add-${p.id}" class="btn px-6 text-[11px]">Agregar</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
      updateCart();
    }

    function saveState() {
      try {
        localStorage.setItem('kool_cart_v9', JSON.stringify(cart));
        localStorage.setItem('kool_selected_v9', JSON.stringify(selected));
      } catch(e) {}
    }
    function loadState() {
      try {
        const c = localStorage.getItem('kool_cart_v9');
        const s = localStorage.getItem('kool_selected_v9');
        if (c) cart = JSON.parse(c);
        if (s) selected = JSON.parse(s);
      } catch(e) {}
    }

    function available(pid, size) {
      const p = products.find(x => x.id === pid);
      if (!p) return 0;
      const stock = p.stockBySize[String(size)] || 0;
      const inCart = cart.filter(i => i.id === pid && i.size === size).length;
      return stock - inCart;
    }

    function choose(pid, size) { selected[pid] = size; render(); saveState(); }
    function add(pid) {
      const size = selected[pid];
      if (!size) return alert('Selecciona una talla primero');
      if (available(pid, size) <= 0) return alert('Sin stock en esa talla');
      const p = products.find(x => x.id === pid);
      if (!p) return;
      cart.push({ ...p, size });
      saveState();
      render();
    }
    function remove(idx) { cart.splice(idx, 1); saveState(); render(); }

    function updateCart() {
      const countEl = document.getElementById('count');
      const totalEl = document.getElementById('total');
      const itemsEl = document.getElementById('items');
      if (!countEl || !totalEl || !itemsEl) return;
      
      countEl.innerText = cart.length;
      const total = cart.reduce((a, b) => a + (Number(b.price) || 0), 0);
      totalEl.innerText = '$' + total.toLocaleString('es-CO');
      
      if (cart.length === 0) {
        itemsEl.innerHTML = '<div class="text-gray-400 py-10 text-center text-sm font-bold uppercase tracking-widest">Carrito vacío</div>';
      } else {
        itemsEl.innerHTML = cart.map((i, idx) => `
          <div class="flex gap-4 border-b border-gray-100 pb-4">
            <img src="${i.img}" class="w-20 h-20 object-contain bg-gray-50 rounded-xl" >
            <div class="flex-1 space-y-1">
              <div class="font-black uppercase text-[11px] tracking-tight">${i.name}</div>
              <div class="text-[10px] font-bold text-gray-400">TALLA: ${i.size} | COLOR: ${i.color}</div>
              <div class="font-black text-sm">$${i.price.toLocaleString('es-CO')}</div>
            </div>
            <button onclick="remove(${idx})" class="w-8 h-8 flex items-center justify-center text-gray-300 hover:text-red-500 transition-colors">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>
        `).join('');
      }
    }

    function toggleCart(open) {
      const d = document.getElementById('drawer');
      const o = document.getElementById('ov');
      if (open) { d.classList.add('open'); o.classList.add('on'); }
      else { d.classList.remove('open'); o.classList.remove('on'); }
    }

    function zoom(src) {
      const z = document.getElementById('zoom');
      const zi = document.getElementById('zoomImg');
      if (!z || !zi) return;
      zi.src = src;
      z.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
    function closeZoom() { document.getElementById('zoom').style.display = 'none'; document.body.style.overflow = 'auto'; }

    function shareProduct(pid, name) {
      const text = `🛍️ Hola! Me interesa este modelo de KOOL PRO: ${name} %0Ahttps://calzado-kool.github.io/kool-pro/#product-${pid}`;
      window.open(`https://api.whatsapp.com/send?phone=120363408397099423@g.us&text=${text}`);
    }

    async function checkoutBridge() {
      try {
        if (!cart.length) return alert('El carrito está vacío');
        const name = document.getElementById('name')?.value.trim() || '';
        const phone = document.getElementById('phone')?.value.trim() || '';
        const addr = document.getElementById('addr')?.value.trim() || '';
        if (!name || !phone || !addr) return alert('Completa nombre, WhatsApp y dirección');

        const btn = document.getElementById('payBtn');

        // PASO 3: Redirección final al pago de Bold
        if (btn.innerText.includes('PAGAR')) {
           if (boldPaymentUrl) window.location.href = boldPaymentUrl;
           return;
        }
        
        // PASO 2: Envío del reporte a WhatsApp (SOLO AL GRUPO)
        if (btn.innerText.includes('WHATSAPP')) {
           const productPhotos = cart.map(i => `🖼️ ${i.name}: https://calzado-kool.github.io/kool-pro/${i.img}`).join('%0A');
           const itemsInfo = cart.map(i => i.name + '(T:' + i.size + ')').join(', ');
           const total = Math.round(cart.reduce((sum, i) => sum + (Number(i.price) || 0), 0));
           const whatsappText = `🛍️ *NUEVO PEDIDO KOOL PRO*%0A%0A📦 *Productos:* ${itemsInfo}%0A🖼️ *Fotos:*%0A${productPhotos}%0A💰 *Total:* ${total.toLocaleString('es-CO')}%0A%0A👤 *Cliente:* ${name}%0A📱 *WhatsApp:* ${phone}%0A📍 *Dirección:* ${addr}`;
           
           window.open(`https://api.whatsapp.com/send?phone=120363408397099423@g.us&text=${whatsappText}`, '_blank');
           
           btn.innerText = 'PASO 2: IR A PAGAR $' + total.toLocaleString('es-CO');
           btn.style.background = '#059669'; 
           return;
        }

        // PASO 1: Generar orden
        btn.disabled = true;
        btn.innerText = 'PROCESANDO...';
        const total = Math.round(cart.reduce((sum, i) => sum + (Number(i.price) || 0), 0));
        const itemsInfo = cart.map(i => i.name + '(T:' + i.size + ')').join(', ');
        const description = itemsInfo + ' | ' + addr + ' | ' + name + ' (' + phone + ')';
        
        const response = await fetch('https://bold-bridge-7qge.vercel.app/api/checkout', {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount: total, label: 'KOOL PRO', description })
        });

        if (!response.ok) throw new Error('Error en pasarela');
        const data = await response.json();
        
        if (data && data.url) {
          boldPaymentUrl = data.url;
          btn.disabled = false;
          btn.innerText = 'PASO 1: ENVIAR PEDIDO A WHATSAPP';
          btn.style.background = '#2563eb'; 
        } else {
          throw new Error('Sin URL de pago');
        }
      } catch (e) {
        alert('Error: ' + e.message);
        const btn = document.getElementById('payBtn');
        if (btn) { btn.disabled = false; btn.innerText = 'Finalizar compra'; btn.style.background = ''; }
      }
    }

    document.addEventListener('DOMContentLoaded', () => { loadState(); render(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kool Pro | Adidas Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #fff; color: #000; }
    .btn-adidas { background: #000; color: #fff; font-weight: 900; text-transform: uppercase; padding: 1.2rem; border-radius: 4px; transition: 0.2s; }
    .btn-adidas:hover { background: #333; }
    .card { border: 1px solid #eee; transition: 0.3s; }
    .card:hover { border-color: #000; }
    .size-btn { border: 1px solid #ddd; padding: 10px; text-align: center; cursor: pointer; font-weight: 700; font-size: 14px; }
    .size-btn.active { border-color: #000; background: #000; color: #fff; }
    .cart-drawer { position: fixed; right: -400px; top: 0; width: 400px; height: 100%; background: #fff; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: 0.3s; z-index: 1000; padding: 20px; display: flex; flex-direction: column; }
    .cart-drawer.open { right: 0; }
  </style>
</head>
<body>
  <nav class="p-6 border-b border-gray-100 flex justify-between items-center sticky top-0 bg-white z-50">
    <div class="text-2xl font-black uppercase tracking-tighter">Kool Pro <span class="text-gray-400">/ Adidas Style</span></div>
    <div class="flex gap-6 items-center">
      <button onclick="toggleCart()" class="relative">
        <i class="fa-solid fa-cart-shopping text-xl"></i>
        <span id="cartCount" class="absolute -top-2 -right-2 bg-black text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6 md:p-12">
    <div id="catalog" class="grid grid-cols-1 md:grid-cols-3 gap-12"></div>
  </main>

  <div id="cartDrawer" class="cart-drawer">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-black uppercase">Tu Carrito</h2>
      <button onclick="toggleCart()"><i class="fa-solid fa-xmark text-2xl"></i></button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto space-y-4"></div>
    <div class="border-t border-gray-100 pt-6 mt-6 space-y-4">
      <div class="flex justify-between text-xl font-black">
        <span>TOTAL</span>
        <span id="cartTotal">$0</span>
      </div>
      <div class="space-y-2">
        <input id="cName" class="w-full border p-3" placeholder="Nombre completo">
        <input id="cPhone" class="w-full border p-3" placeholder="WhatsApp">
        <textarea id="cAddr" class="w-full border p-3 h-20" placeholder="Dirección de envío"></textarea>
      </div>
      <button onclick="checkout()" id="btnPay" class="btn-adidas w-full">Finalizar Compra</button>
    </div>
  </div>

  <script>
    const products = [
      { id: 'p1', name: 'Runner Blue Mesh', price: 155000, color: 'Azul Oscuro', material: 'Malla transpirable de alto rendimiento', img: 'media/1781009828516.jpg', sizes: [35,36,37,38,39,40] },
      { id: 'p2', name: 'Urban Black Gum', price: 145000, color: 'Negro / Caramelo', material: 'Sintético reforzado con suela de goma', img: 'media/1781009836099.jpg', sizes: [35,36,37,38,39,40] },
      { id: 'p3', name: 'Nude Texture Heel', price: 135000, color: 'Beige / Nude', material: 'Cuero sintético con acabado texturizado', img: 'media/1781009853950.jpg', sizes: [35,36,37,38,39,40] }
    ];

    let cart = [];
    let selectedSizes = {};

    function render() {
      const cat = document.getElementById('catalog');
      cat.innerHTML = products.map(p => `
        <div class="card p-4">
          <img src="${p.img}" class="w-full aspect-square object-cover mb-4">
          <h3 class="text-xl font-black uppercase">${p.name}</h3>
          <p class="text-gray-500 text-sm mb-4">${p.color} | ${p.material}</p>
          <div class="text-2xl font-black mb-6">$${p.price.toLocaleString()}</div>
          <div class="grid grid-cols-6 gap-1 mb-6">
            ${p.sizes.map(s => `
              <div onclick="selectSize('${p.id}', ${s})" class="size-btn ${selectedSizes[p.id] === s ? 'active' : ''}">${s}</div>
            `).join('')}
          </div>
          <button onclick="addToCart('${p.id}')" class="btn-adidas w-full">Agregar</button>
        </div>
      `).join('');
    }

    function selectSize(pid, size) {
      selectedSizes[pid] = size;
      render();
    }

    function addToCart(pid) {
      if (!selectedSizes[pid]) return alert('Selecciona una talla');
      const p = products.find(x => x.id === pid);
      cart.push({ ...p, size: selectedSizes[pid] });
      updateCart();
      toggleCart(true);
    }

    function updateCart() {
      document.getElementById('cartCount').innerText = cart.length;
      const items = document.getElementById('cartItems');
      const total = cart.reduce((s, i) => s + i.price, 0);
      document.getElementById('cartTotal').innerText = '$' + total.toLocaleString();
      
      items.innerHTML = cart.map((i, idx) => `
        <div class="flex gap-4 border-b pb-4">
          <img src="${i.img}" class="w-16 h-16 object-cover">
          <div class="flex-1">
            <div class="font-bold uppercase text-xs">${i.name}</div>
            <div class="text-xs text-gray-400">Talla: ${i.size}</div>
            <div class="font-black">$${i.price.toLocaleString()}</div>
          </div>
          <button onclick="removeItem(${idx})"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');
    }

    function removeItem(idx) {
      cart.splice(idx, 1);
      updateCart();
    }

    function toggleCart(force) {
      const drawer = document.getElementById('cartDrawer');
      if (force === true) drawer.classList.add('open');
      else if (force === false) drawer.classList.remove('open');
      else drawer.classList.toggle('open');
    }

    async function checkout() {
      const name = document.getElementById('cName').value;
      const phone = document.getElementById('cPhone').value;
      const addr = document.getElementById('cAddr').value;
      if (!name || !phone || !addr) return alert('Completa los datos');

      const btn = document.getElementById('btnPay');
      btn.disabled = true;
      btn.innerText = 'Procesando...';

      const total = cart.reduce((s, i) => s + i.price, 0);
      const desc = cart.map(i => `${i.name} (T:${i.size})`).join(', ');

      try {
        const res = await fetch('https://bold-bridge-7qge.vercel.app/api/checkout', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ amount: total, label: 'Calzado Kool', description: desc + ' | Envío: ' + addr })
        });
        const data = await res.json();
        if (data.url) {
           window.open('https://wa.me/573057778133?text=Hola, acabo de hacer un pedido: ' + desc + ' por $' + total.toLocaleString(), '_blank');
           location.href = data.url;
        }
      } catch (e) {
        alert('Error al conectar con Bold');
        btn.disabled = false;
        btn.innerText = 'Finalizar Compra';
      }
    }

    render();
  </script>
</body>
</html>

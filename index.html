<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calzado Kool | Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .kool-gradient { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
        .modal-active { overflow: hidden; }
        .size-btn.active { background-color: #ea580c; color: white; border-color: #ea580c; }
    </style>
</head>
<body class="text-slate-900">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 kool-gradient rounded-xl flex items-center justify-center shadow-lg shadow-orange-200">
                    <span class="text-white font-extrabold text-xl">K</span>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-none tracking-tight">CALZADO KOOL</h1>
                    <p class="text-[10px] text-orange-600 font-bold uppercase tracking-widest">Licencia Oficial</p>
                </div>
            </div>
            <button onclick="toggleCart()" class="relative p-2 bg-slate-100 rounded-full hover:bg-slate-200 transition-colors">
                <i class="fa-solid fa-cart-shopping text-slate-700"></i>
                <span id="cart-count" class="absolute -top-1 -right-1 kool-gradient text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <!-- Welcome Section -->
        <section class="mb-10">
            <div class="bg-slate-900 rounded-[2rem] p-8 text-white relative overflow-hidden shadow-2xl shadow-slate-300">
                <div class="relative z-10 max-w-md">
                    <span class="bg-orange-500/20 text-orange-400 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest mb-4 inline-block border border-orange-500/30">Nueva Colección 2026</span>
                    <h2 class="text-4xl font-extrabold mb-4 leading-tight">Calidad que camina contigo.</h2>
                    <p class="text-slate-400 text-sm mb-6">Explora nuestra línea premium diseñada para durar y destacar en cada paso.</p>
                </div>
                <div class="absolute top-0 right-0 w-64 h-64 kool-gradient opacity-20 blur-[80px]"></div>
            </div>
        </section>

        <!-- Product Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            
            <!-- PRODUCTO PRUEBA -->
            <div class="product-card bg-white rounded-[2rem] border border-slate-200 p-4" onclick="openProduct('PRODUCTO PRUEBA', 1000, 'https://placehold.co/600x600/f3f4f6/ea580c?text=PRUEBA', {'35': 10})">
                <div class="aspect-square rounded-[1.5rem] bg-slate-100 mb-4 overflow-hidden relative group">
                    <div class="absolute inset-0 flex items-center justify-center text-6xl group-hover:scale-110 transition-transform">👟</div>
                    <div class="absolute top-3 left-3">
                        <span class="bg-blue-600 text-white text-[9px] font-bold px-2 py-1 rounded-lg uppercase shadow-lg">Modo Prueba</span>
                    </div>
                </div>
                <h3 class="font-bold text-lg mb-1">Producto de Prueba</h3>
                <div class="flex items-center justify-between">
                    <span class="text-2xl font-extrabold text-slate-900">$1.000</span>
                    <button class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center hover:bg-orange-600 transition-colors">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- TRACTOR POWER -->
            <div class="product-card bg-white rounded-[2rem] border border-slate-200 p-4" onclick="openProduct('Tractor Power', 160000, 'img/boots_yellow.jpg', {'34': 2, '35': 3, '37': 4, '38': 2, '39': 9, '41': 1, '42': 2})">
                <div class="aspect-square rounded-[1.5rem] bg-slate-100 mb-4 overflow-hidden relative">
                    <img src="img/boots_yellow.jpg" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x600/f3f4f6/ea580c?text=Tractor+Power'">
                    <div class="absolute top-3 left-3">
                        <span class="bg-green-600 text-white text-[9px] font-bold px-2 py-1 rounded-lg uppercase shadow-lg">En Stock</span>
                    </div>
                </div>
                <h3 class="font-bold text-lg mb-1">Tractor Power Yellow</h3>
                <div class="flex items-center justify-between">
                    <span class="text-2xl font-extrabold text-slate-900">$160.000</span>
                    <button class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center hover:bg-orange-600 transition-colors">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeProduct()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] p-8 shadow-2xl transition-transform duration-300 translate-y-full" id="modal-content">
            <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-8"></div>
            <div class="flex flex-col md:flex-row gap-8">
                <div class="w-full md:w-1/2 aspect-square rounded-[2rem] bg-slate-100 overflow-hidden flex items-center justify-center text-8xl" id="modal-img-container">
                    <img id="modal-img" src="" class="w-full h-full object-cover">
                </div>
                <div class="w-full md:w-1/2">
                    <h2 id="modal-title" class="text-3xl font-extrabold mb-2 uppercase"></h2>
                    <p id="modal-price" class="text-3xl font-bold text-orange-600 mb-6"></p>
                    
                    <div class="mb-6">
                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Seleccionar Talla</p>
                        <div id="modal-sizes" class="flex flex-wrap gap-2">
                            <!-- Sizes inject here -->
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="addToCart()" class="flex-1 kool-gradient text-white font-bold py-4 rounded-2xl shadow-xl shadow-orange-200 active:scale-95 transition-transform">
                            AGREGAR AL CARRITO
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 z-[150] w-full max-w-sm bg-white shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-xl font-extrabold">TU PEDIDO</h2>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-900"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Cart items inject here -->
        </div>
        <div class="p-6 border-t border-slate-100 bg-slate-50">
            <div class="space-y-4 mb-6">
                <input type="text" id="cName" placeholder="Nombre completo" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-orange-500 outline-none">
                <input type="text" id="cId" placeholder="Cédula / NIT" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-orange-500 outline-none">
                <input type="text" id="cPhone" placeholder="Celular" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-orange-500 outline-none">
                <input type="text" id="cAddr" placeholder="Dirección de entrega" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm focus:border-orange-500 outline-none">
            </div>
            <div class="flex items-center justify-between mb-4">
                <span class="text-slate-400 font-bold uppercase text-[10px]">Total a pagar</span>
                <span id="cart-total" class="text-2xl font-black">$ 0</span>
            </div>
            <button onclick="checkout()" class="w-full kool-gradient text-white font-bold py-4 rounded-2xl shadow-xl shadow-orange-200 active:scale-95 transition-transform flex items-center justify-center gap-3">
                <i class="fa-solid fa-shield-check"></i> AUTORIZAR PAGO BOLD
            </button>
        </div>
    </div>

    <script>
        let cart = [];
        let currentProduct = null;
        let selectedSize = null;

        function openProduct(name, price, img, stockMap) {
            currentProduct = { name, price, img, stockMap };
            selectedSize = null;
            
            document.getElementById('modal-title').innerText = name;
            document.getElementById('modal-price').innerText = '$' + price.toLocaleString('es-CO');
            
            const imgEl = document.getElementById('modal-img');
            const imgCont = document.getElementById('modal-img-container');
            if (img) {
                imgEl.src = img;
                imgEl.classList.remove('hidden');
                imgCont.querySelector('span')?.remove();
            } else {
                imgEl.classList.add('hidden');
                imgCont.innerHTML = '<span style="font-size:64px;">👟</span>';
            }
            
            const sCont = document.getElementById('modal-sizes');
            sCont.innerHTML = '';
            
            const allSizes = ['34', '35', '36', '37', '38', '39', '40', '41', '42'];
            allSizes.forEach(size => {
                const stock = stockMap[size] || 0;
                const btn = document.createElement('button');
                btn.className = `size-btn w-12 h-12 rounded-xl border-2 flex items-center justify-center font-bold text-sm transition-all ${stock > 0 ? 'border-slate-200 text-slate-700 hover:border-orange-600' : 'border-slate-100 text-slate-200 cursor-not-allowed opacity-50'}`;
                btn.innerText = size;
                if (stock > 0) {
                    btn.onclick = () => {
                        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        selectedSize = size;
                    };
                }
                sCont.appendChild(btn);
            });
            
            document.getElementById('product-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('translate-y-full');
            }, 10);
            document.body.classList.add('modal-active');
        }

        function closeProduct() {
            document.getElementById('modal-content').classList.add('translate-y-full');
            setTimeout(() => {
                document.getElementById('product-modal').classList.add('hidden');
                document.body.classList.remove('modal-active');
            }, 300);
        }

        function addToCart() {
            if (!selectedSize) return alert('Por favor selecciona una talla');
            
            cart.push({
                ...currentProduct,
                size: selectedSize,
                qty: 1
            });
            
            updateCart();
            closeProduct();
            toggleCart();
        }

        function updateCart() {
            const count = cart.length;
            document.getElementById('cart-count').innerText = count;
            
            const itemsCont = document.getElementById('cart-items');
            itemsCont.innerHTML = '';
            
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'flex items-center gap-4 bg-slate-50 p-4 rounded-2xl relative';
                div.innerHTML = `
                    <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center border border-slate-100 overflow-hidden">
                        ${item.img ? `<img src="${item.img}" class="w-full h-full object-cover">` : '<span class="text-xl">👟</span>'}
                    </div>
                    <div class="flex-1">
                        <h4 class="font-bold text-sm uppercase">${item.name}</h4>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Talla ${item.size}</p>
                        <p class="text-orange-600 font-extrabold text-sm">$${item.price.toLocaleString('es-CO')}</p>
                    </div>
                    <button onclick="removeItem(${index})" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                `;
                itemsCont.appendChild(div);
            });
            
            document.getElementById('cart-total').innerText = '$' + total.toLocaleString('es-CO');
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            sidebar.classList.toggle('translate-x-full');
        }

        async function checkout() {
            const name = document.getElementById('cName').value;
            const id = document.getElementById('cId').value;
            const phone = document.getElementById('cPhone').value;
            const addr = document.getElementById('cAddr').value;

            if (cart.length === 0) return alert('El carrito está vacío');
            if (!name || !id || !phone || !addr) return alert('Por favor completa todos los datos de envío');

            const total = cart.reduce((s, i) => s + i.price, 0);
            let itemsText = cart.map(i => `- ${i.name} (Talla ${i.size})`).join('\\n');
            const waText = `🚀 *NUEVO PEDIDO WEB (CALZADO KOOL)*\\n${itemsText}\\n\\n💰 *Total: $${total.toLocaleString('es-CO')}*\\n\\n👤 Cliente: ${name}\\n🆔 CC: ${id}\\n📱 Cel: ${phone}\\n📍 Envío: ${addr}`;

            // Notificar WhatsApp
            window.open(`https://wa.me/573057778133?text=${encodeURIComponent(waText)}`, '_blank');

            // Generar Pago Bold (Dinámico)
            const btn = document.querySelector('#cart-sidebar button[onclick="checkout()"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERANDO LINK...';
            btn.disabled = true;

            try {
                const response = await fetch('https://api.bold.co/checkout/v1/payment-links', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer 94Si4w-f6HhR6hSQNf4W_g',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        label: 'Compra Calzado Kool',
                        description: itemsText.substring(0, 200),
                        amount: total,
                        currency: 'COP',
                        order_id: 'KOOL-' + Date.now(),
                        redirect_url: window.location.href
                    })
                });

                const data = await response.json();
                if (data.payload && data.payload.url) {
                    window.location.href = data.payload.url;
                } else {
                    alert('Error en Bold. Por favor intenta de nuevo.');
                    btn.innerHTML = '<i class="fa-solid fa-shield-check"></i> AUTORIZAR PAGO BOLD';
                    btn.disabled = false;
                }
            } catch (e) {
                alert('Error de conexión con Bold');
                btn.innerHTML = '<i class="fa-solid fa-shield-check"></i> AUTORIZAR PAGO BOLD';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
